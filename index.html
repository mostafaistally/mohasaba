<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر الحسابات الاحترافي — Mustafa Tech (Pro)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2942">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الحسابات">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F1F5F9; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --in:#059669; --in-bg:#ECFDF5; --out:#DC2626; --out-bg:#FEF2F2;
  --accent:#0F2942; --accent-2:#1E40AF; --accent-ink:#FFFFFF;
  --warn:#B45309; --warn-bg:#FFFBEB;
  --usdt:#0D9488; --usdt-bg:#F0FDFA;
  --profit:#D97706; --profit-bg:#FFFBEB;
  --sham:#0284C7; --sham-bg:#F0F9FF;
  --magic:#6D28D9; --magic-bg:#F5F3FF;
  --cap:#0F766E; --cap-bg:#F0FDFA;
  --fx:#D97706; --fx-bg:#FEF3C7;
  --shadow:0 4px 16px -2px rgba(15,23,42,.06), 0 2px 6px -2px rgba(15,23,42,.04);
  --shadow-lg:0 12px 28px -4px rgba(15,23,42,.12);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1120; --card:#111827; --ink:#F1F5F9; --muted:#94A3B8; --line:#1E293B;
    --in:#34D399; --in-bg:#064E3B; --out:#F87171; --out-bg:#7F1D1D;
    --accent:#38BDF8; --accent-2:#60A5FA; --accent-ink:#0B1120;
    --warn:#FBBF24; --warn-bg:#451A03;
    --usdt:#2DD4BF; --usdt-bg:#134E4A;
    --profit:#FBBF24; --profit-bg:#451A03;
    --sham:#38BDF8; --sham-bg:#0C4A6E;
    --magic:#A78BFA; --magic-bg:#2E1065;
    --cap:#2DD4BF; --cap-bg:#115E59;
    --fx:#F59E0B; --fx-bg:#451A03;
    --shadow:0 4px 16px -2px rgba(0,0,0,.35);
    --shadow-lg:0 12px 28px -4px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.55}
body{padding-bottom:165px;transition:background .2s,color .2s}

/* وضع الخصوصية وإخفاء الأرصدة بضغطة زر */
body.privacy-on .priv,
body.privacy-on .bal,
body.privacy-on .tx-amt,
body.privacy-on .balpill b,
body.privacy-on .pf-row b,
body.privacy-on .cap-box .val{
  filter:blur(7px);
  user-select:none;
  transition:filter .18s ease;
}
body.privacy-on .priv:hover,
body.privacy-on .bal:hover{
  filter:blur(5px);
}

/* واجهة اللابتوب والشاشات العريضة */
@media(min-width: 920px){
  body{padding-bottom:28px;padding-right:268px}
  nav{position:fixed!important;top:0!important;bottom:0!important;right:0!important;left:auto!important;width:268px!important;border-top:0!important;border-left:1px solid var(--line)!important;display:flex!important;flex-direction:column!important;padding:22px 12px!important;justify-content:flex-start!important;gap:6px!important;box-shadow:var(--shadow)!important}
  nav button{padding:13px 16px!important;text-align:right!important;border-radius:12px!important;font-size:15px!important;box-shadow:none!important;display:flex!important;align-items:center!important;gap:8px!important}
  nav button.on{background:linear-gradient(135deg,#0F2942,#1E40AF)!important;color:#FFFFFF!important;box-shadow:0 4px 12px rgba(30,64,175,.28)!important}
  header{position:sticky;top:0;z-index:8}
  main{max-width:1180px!important;margin:0 auto!important;padding:22px!important}
  .fab-wrap{left:30px!important}
}

header{background:linear-gradient(135deg,#0F2942 0%,#1E3A8A 100%);color:#FFFFFF;
  padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 14px rgba(15,41,66,.18);position:sticky;top:0;z-index:8}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}
.brand-sub{font-size:11px;opacity:.85;font-weight:600;display:block}
.role-badge{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);padding:4px 12px;border-radius:99px;font-size:12px;cursor:pointer;font-weight:700;border:1px solid rgba(255,255,255,.2);transition:all .15s}
.role-badge:hover{background:rgba(255,255,255,.26)}
.priv-btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25);padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
body.privacy-on .priv-btn{background:#F59E0B;color:#0F172A;border-color:#F59E0B}
#saveState{font-size:11px;opacity:.92;background:rgba(0,0,0,.22);padding:3px 9px;border-radius:99px}

main{max-width:820px;margin:0 auto;padding:14px}
h2{font-size:16px;margin:20px 0 10px;font-weight:800;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.box:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.box .nm{color:var(--muted);font-size:13px;font-weight:700}
.box .bal{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.box-edit-btn{position:absolute;top:10px;left:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 6px;color:var(--muted);cursor:pointer;font-size:12px}
.pos{color:var(--in)} .neg{color:var(--out)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.tag.in{background:var(--in-bg);color:var(--in)} .tag.out{background:var(--out-bg);color:var(--out)}
.tag.usdt{background:var(--usdt-bg);color:var(--usdt)}
.tag.sham{background:var(--sham-bg);color:var(--sham)}
.tag.fx{background:var(--fx-bg);color:var(--fx)}
.tag.journal{background:var(--magic-bg);color:var(--magic)}
.tag.profit{background:var(--profit-bg);color:var(--profit)}
.tag.exp{background:var(--out-bg);color:var(--out)}
.tag.asset{background:var(--cap-bg);color:var(--cap)}
.tx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
.tx:hover{border-color:var(--accent-2)}
.tx-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tx-top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.when{font-size:11.5px;color:var(--muted);direction:ltr;font-weight:600}
.tx-amt{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.tx-amt.in{color:var(--in)} .tx-amt.out{color:var(--out)}
.sub{font-size:12.5px;color:var(--muted)}
.note{font-size:13px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.rate-row{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line)}
.rate-row:last-of-type{border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:28px 12px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:13px;font-family:inherit;font-weight:600;transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--ink);font-family:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(30,64,175,.12)}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin:10px 0 4px}
button{font-family:inherit;font-size:15px;cursor:pointer}
.btn{border:0;border-radius:11px;padding:11px 16px;background:linear-gradient(135deg,#0F2942,#1E40AF);color:#FFFFFF;font-weight:700;box-shadow:0 3px 10px rgba(15,41,66,.18);transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.99)}
.btn.usdt{background:linear-gradient(135deg,#0D9488,#0F766E);color:#fff}
.btn.sham{background:linear-gradient(135deg,#0284C7,#0369A1);color:#fff}
.btn.fx{background:linear-gradient(135deg,#D97706,#B45309);color:#fff}
.btn.magic{background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff}
.btn.cap{background:linear-gradient(135deg,#0F766E,#115E59);color:#fff}
.btn.whatsapp{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff}
.btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#DC2626,#991B1B);color:#fff}
.btn.full{width:100%;margin-top:12px}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.seg button{border:0;padding:11px 8px;background:transparent;color:var(--ink);font-weight:700;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on.in{background:var(--in);color:#fff}
.seg button.on.out{background:var(--out);color:#fff}
.seg button.on.sham{background:var(--sham);color:#fff}
.seg button.on.fx{background:var(--fx);color:#fff}

.fx-box{background:var(--warn-bg);border:1px solid rgba(217,119,6,.35);border-radius:12px;padding:4px 12px 12px;margin-top:12px}
.fx-box label{color:var(--warn)}
.usdt-panel{background:var(--usdt-bg);border:1.5px solid var(--usdt);border-radius:12px;padding:12px;margin-top:12px}
.sham-panel{background:var(--sham-bg);border:1.5px solid var(--sham);border-radius:12px;padding:12px;margin-top:12px}
.usdt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.usdt-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.usdt-item label{margin:0 0 4px;font-size:12px;font-weight:700;color:var(--ink)}
.usdt-item input{padding:8px;font-size:15px}
.split-badge{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 2px 0 0;font-variant-numeric:tabular-nums}
.sum{font-weight:700;font-variant-numeric:tabular-nums;margin-top:10px;color:var(--ink)}
.err{background:var(--out-bg);color:var(--out);border:1px solid var(--out);border-radius:10px;padding:9px 12px;margin-top:10px;display:none;font-weight:700;font-size:13.5px}
.warn-box{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13px;font-weight:700}
.suggest-box{background:var(--card);border:1.5px dashed var(--accent-2);border-radius:10px;padding:8px 10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}

/* منتقي الزبائن الذكي مع البحث وأكثر 3 زبائن تكراراً */
.cust-picker{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:4px}
.cust-top-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.cust-quick-btn{background:var(--card);border:1px solid var(--accent-2);color:var(--accent-2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.cust-quick-btn.active{background:var(--accent-2);color:#fff}

/* شاشة يومية الصندوق متعدد الأسطر */
.journal-header-bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;box-shadow:var(--shadow)}
@media(min-width:750px){.journal-header-bar{grid-template-columns:1fr 1.2fr 1.2fr 1fr}}
.j-table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.j-table{width:100%;border-collapse:collapse;min-width:760px}
.j-table th{background:var(--accent);color:var(--accent-ink);padding:10px 8px;font-size:13px;text-align:right;white-space:nowrap}
.j-table td{border-bottom:1px solid var(--line);padding:6px;vertical-align:middle}
.j-table input,.j-table select{padding:7px 8px;font-size:14px;border-radius:8px}
.j-cards{display:none}
@media(max-width:749px){
  .j-table-wrap{display:none}
  .j-cards{display:block}
}
.j-card-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.j-card-num{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px;display:flex;justify-content:space-between}
.j-totals-bar{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}

/* الإضافات السحرية ولوحة رأس المال */
.magic-card{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--magic);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.magic-title{font-size:16px;font-weight:800;color:var(--magic);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.calc-box{background:var(--card);border:1.5px solid var(--magic);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.cap-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:700px){.cap-summary-grid{grid-template-columns:repeat(3,1fr)}}
.cap-box{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--cap);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.cap-box .lbl{font-size:12px;color:var(--muted);font-weight:700}
.cap-box .val{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.profit-formula{background:var(--card);border:2px solid var(--profit);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.pf-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.pf-row:last-child{border-bottom:0;padding-top:10px;font-size:17px;font-weight:800}

/* Auth Screen Styles */
#authContainer{max-width:440px;margin:40px auto;padding:20px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow-lg)}
.auth-card h2{text-align:center;margin-top:0;color:var(--accent);justify-content:center}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
nav button{border:0;background:none;color:var(--muted);padding:10px 1px;font-size:11px;font-weight:700}
nav button.on{color:var(--accent-2);font-weight:800;box-shadow:inset 0 3px 0 var(--accent-2)}

.fab-wrap{position:fixed;left:12px;bottom:74px;z-index:7;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:96vw}
.fab-btn{border:0;border-radius:99px;background:var(--accent);color:#fff;padding:9px 13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:12.5px}
.fab-btn.fx{background:var(--fx);color:#fff}
.fab-btn.usdt{background:var(--usdt);color:#fff}
.fab-btn.sham{background:var(--sham);color:#fff}
.fab-btn.journal{background:var(--magic);color:#fff}
.fab-btn.exp{background:var(--out);color:#fff}

#ov{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);display:none;z-index:20;align-items:flex-end;justify-content:center}
#ov.open{display:flex}
#sheet{background:var(--bg);width:100%;max-width:860px;max-height:93vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 30px;box-shadow:var(--shadow-lg)}
#sheet h3{margin:0 0 6px;font-size:18px;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.st-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.st-line{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.balbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.balpill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow)}
.balpill small{display:block;color:var(--muted);font-weight:700}
.balpill b{font-size:19px}
.footer-brand{text-align:center;font-size:12px;color:var(--muted);margin-top:26px;padding:10px;border-top:1px dashed var(--line)}
.footer-brand b{color:var(--accent-2)}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;direction:ltr;min-height:110px}

.receipt-box{background:#fff;color:#111;border:2px solid #0F2942;border-radius:14px;padding:18px;margin-top:10px;font-family:"Cairo","Segoe UI",Tahoma,sans-serif}
.receipt-head{border-bottom:2px dashed #ccc;padding-bottom:10px;margin-bottom:12px;text-align:center}
.receipt-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}

@media print{
  header,nav,.fab-wrap,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .st-row,.balpill,.receipt-box{border-color:#999;break-inside:avoid}
}
</style>
</head>
<body>
<header id="appHeader" style="display:none">
  <div>
    <h1>دفتر الحسابات الاحترافي <span id="lockBadge" style="font-size:12px"></span></h1>
    <span class="brand-sub">برمجة وتطوير: Mustafa Tech — نظام الصرافة والحوالات</span>
  </div>
  <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
    <button id="privacyToggleBtn" class="priv-btn" onclick="togglePrivacyMode()" title="إخفاء أو إظهار الأرصدة">👁️ إخفاء الأرصدة</button>
    <button id="pwaInstallBtn" class="chip" onclick="installPWA()" style="display:none;background:#25D366;color:#fff;border:0;padding:4px 10px;font-size:12px;font-weight:700">📲 تثبيت</button>
    <span class="role-badge" id="roleBadge" onclick="toggleRoleModal()">مدير ⚙️</span>
    <button class="chip" onclick="logoutUser()" style="background:#DC2626;color:#fff;border:0;padding:4px 10px;font-size:12px">خروج</button>
    <span id="saveState"></span>
  </div>
</header>

<div id="authContainer">
  <div class="auth-card">
    <h2>دفتر الحسابات الاحترافي</h2>
    <div class="sub" style="text-align:center;margin-bottom:14px">نظام الصرافة والحوالات وإدارة رأس المال والمصاريف</div>
    
    <label>البريد الإلكتروني</label>
    <input id="authEmail" type="email" placeholder="name@example.com" style="direction:ltr;text-align:left">
    
    <label style="margin-top:10px">كلمة المرور</label>
    <input id="authPass" type="password" placeholder="••••••••" style="direction:ltr;text-align:left">

    <div class="err" id="authErr"></div>

function hashPinSync(pin){
  let h=2166136261;
  const s='MT_SALT_v7_'+String(pin);
  for(let i=0;i<s.length;i++){
    h^=s.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return 'h7_'+(h>>>0).toString(16);
}

  return p;
}

let hasPendingLocalChanges = localStorage.getItem('acc-pending-sync') === '1';

const MAX_DELETED = 10000;
function markDeleted(id){
  if(!id) return;
  if(!Array.isArray(db.deletedIds)) db.deletedIds = [];
  if(!db.deletedIds.includes(id)) db.deletedIds.push(id);
  if(db.deletedIds.length > MAX_DELETED) db.deletedIds = db.deletedIds.slice(-MAX_DELETED);
}

function mergeArraysSmart(cloudArr, localArr, deletedSet){
  const map = new Map();
  (Array.isArray(cloudArr) ? cloudArr : []).forEach(item => {
    if(item && item.id && !deletedSet.has(item.id)){
      map.set(item.id, item);
    }
  });
  (Array.isArray(localArr) ? localArr : []).forEach(item => {
    if(item && item.id && !deletedSet.has(item.id)){
      const existing = map.get(item.id);
      if(!existing){
        map.set(item.id, item);
      } else {
        const cTime = Number(existing._u) || 0;
        const lTime = Number(item._u) || 0;
        if(lTime >= cTime){
          map.set(item.id, item);
        }
      }
    }
  });
  return Array.from(map.values());
}

function lockMetaOf(d){
  const m = {};
  const src = (d && d.lockMeta && typeof d.lockMeta === 'object') ? d.lockMeta : {};
  Object.keys(src).forEach(k => { if(src[k]) m[k] = src[k]; });
  (Array.isArray(d && d.lockedDates) ? d.lockedDates : []).forEach(k => { if(!m[k]) m[k] = {l:true, _u:0}; });
  return m;
}
function mergeLockMeta(a, b){
  const out = {};
  [a, b].forEach(m => Object.keys(m || {}).forEach(d => {
    const x = m[d]; if(!x) return;
    if(!out[d] || (Number(x._u)||0) >= (Number(out[d]._u)||0)) out[d] = x;
  }));
  return out;
}

function mergeSettings(c, l){
  c = c || {}; l = l || {};
  const ck = c._ku || {}, lk = l._ku || {};
  const out = {}, ku = {};
  new Set([...Object.keys(c), ...Object.keys(l)]).forEach(k => {
    if(k === '_ku') return;
    const inC = (k in c), inL = (k in l);
    const ct = Number(ck[k]) || 0, lt = Number(lk[k]) || 0;
    out[k] = (inL && (!inC || lt >= ct)) ? l[k] : c[k];
    ku[k] = Math.max(ct, lt);
  });
  out._ku = ku;
  return out;
}

  });
}

function recordAudit(){

      if(!it || !it.id) return;
      const str = JSON.stringify(it); cur.set(it.id, str);
      const p = prev.get(it.id);
      if(p === undefined) out.push(mk('add', c, it));
      else if(p !== str) out.push(mk('edit', c, it));

    prev.forEach((str, id) => {
      if(!cur.has(id)){ let it = {}; try{ it = JSON.parse(str); }catch(e){} out.push(mk('del', c, it, id)); }

    next[c] = cur;

    p.forEach(d => { if(!ns.has(d)) out.push(mk('unlock', 'lock', 'فتح قفل يوم ' + d, d)); });

  if(out.length) db.audit = trimAudit((Array.isArray(db.audit) ? db.audit : []).concat(out));

    let arr = readBackups();
    const last = arr[arr.length - 1];
    if(!force && last && Date.now() - last.t < 30*60*1000) return;
    arr.push({ t: Date.now(), why: why || '', data: raw });
    arr = arr.slice(-4);
    const total = () => arr.reduce((n, b) => n + (b.data ? b.data.length : 0), 0);
    while(arr.length > 1 && total() > 1500000) arr.shift();
    while(arr.length){
      try{ localStorage.setItem(BAK_KEY, JSON.stringify(arr)); break; }catch(e){ arr.shift(); }
    }
  }catch(e){}
}

function mergeFullDB(cloudDb, localDb){
  if(!cloudDb) return localDb;
  if(!localDb) return cloudDb;
  const delArr = Array.from(new Set([
    ...(Array.isArray(cloudDb.deletedIds) ? cloudDb.deletedIds : []),
    ...(Array.isArray(localDb.deletedIds) ? localDb.deletedIds : [])
  ])).slice(-MAX_DELETED);
  const delSet = new Set(delArr);

  const mergedRates = Object.assign({}, cloudDb.rates || {});
  if(localDb.rates && typeof localDb.rates === 'object'){
    Object.keys(localDb.rates).forEach(d => {
      mergedRates[d] = Object.assign({}, mergedRates[d] || {}, localDb.rates[d]);
    });
  }

  const curMap = new Map();
  (Array.isArray(cloudDb.currencies) ? cloudDb.currencies : []).forEach(c => { if(c&&c.code&&!delSet.has('cur_'+c.code)) curMap.set(c.code, c); });
  (Array.isArray(localDb.currencies) ? localDb.currencies : []).forEach(c => { if(c&&c.code&&!delSet.has('cur_'+c.code)) curMap.set(c.code, c); });

  const lm = mergeLockMeta(lockMetaOf(cloudDb), lockMetaOf(localDb));

  return {
    currencies: Array.from(curMap.values()),
    cashboxes: mergeArraysSmart(cloudDb.cashboxes, localDb.cashboxes, delSet),
    customers: mergeArraysSmart(cloudDb.customers, localDb.customers, delSet),
    rates: mergedRates,
    tx: mergeArraysSmart(cloudDb.tx, localDb.tx, delSet),
    assets: mergeArraysSmart(cloudDb.assets, localDb.assets, delSet),
    expenses: mergeArraysSmart(cloudDb.expenses, localDb.expenses, delSet),
    otherRevenues: mergeArraysSmart(cloudDb.otherRevenues, localDb.otherRevenues, delSet),
    lockMeta: lm,
    lockedDates: Object.keys(lm).filter(d => lm[d] && lm[d].l).sort(),
    audit: trimAudit(mergeArraysSmart(cloudDb.audit, localDb.audit, new Set())),
    stocktakes: trimStocktakes(mergeArraysSmart(cloudDb.stocktakes, localDb.stocktakes, delSet)),
    deletedIds: delArr,
    voucherSeq: Math.max(num(cloudDb.voucherSeq)||1001, num(localDb.voucherSeq)||1001),
    updatedAt: Math.max(Number(cloudDb.updatedAt)||0, Number(localDb.updatedAt)||0, Date.now()),
    settings: mergeSettings(cloudDb.settings, localDb.settings)
  };
}

let saveBusy = false, saveQueued = false, saveForce = false;

function cloudReady(){
  return !!(sbClient && currentUser && currentUser.email && !currentUser.email.endsWith('.local'));
}

async function pushToCloud(force){
  isSyncingFromCloud = true;
  setState('جاري المزامنة مع SQL 🔄...');
  let done = false;
  const MAXTRY = 5;
  for(let attempt = 0; attempt < MAXTRY && !done; attempt++){
    let remote = null, stamp = null;
    if(!force){
      const { data, error } = await sbClient.from('app_data').select('payload, updated_at').eq('id', 'main_db').maybeSingle();
      if(error) throw error;
      if(data && data.payload){ remote = data.payload; stamp = data.updated_at; }
      if(remote){
        takeSafetyBackup('merge');
        const role = db.settings ? db.settings.role : 'manager';
        db = mergeFullDB(remote, db);
        ensureDefaults();
        db.settings.role = role;
      }
    }
    const nowIso = new Date().toISOString();
    if(force){
      const { error } = await sbClient.from('app_data').upsert({ id:'main_db', payload:db, updated_at:nowIso });
      if(error) throw error;
      done = true;
    } else if(!remote){
      const { error } = await sbClient.from('app_data').insert({ id:'main_db', payload:db, updated_at:nowIso });
      if(error){
        if(error.code === '23505') continue;
        const r2 = await sbClient.from('app_data').upsert({ id:'main_db', payload:db, updated_at:nowIso });
        if(r2.error) throw r2.error;
      }
      done = true;
    } else if(attempt === MAXTRY - 1){
      const { error } = await sbClient.from('app_data').upsert({ id:'main_db', payload:db, updated_at:nowIso });
      if(error) throw error;
      done = true;
    } else {
      const { data: upd, error } = await sbClient.from('app_data')
        .update({ payload:db, updated_at:nowIso })
        .eq('id', 'main_db').eq('updated_at', stamp)
        .select('id');
      if(error) throw error;
      if(upd && upd.length) done = true;
    }
  }
  if(!done) throw new Error('sync conflict');
  setPendingSync(false);
  try{ localStorage.setItem('acc-db-pro', JSON.stringify(db)); }catch(e){}
  rebaseSnaps();
  render();
  setState('متزامن 100% في SQL 🗄️');
}

async function save(forceFullReplace = false){
  if(forceFullReplace){ logImportAudit(); rebaseSnaps(); } else { recordAudit(); }
  stampSettings();
  db.updatedAt = Date.now();
  setPendingSync(true);
  try{ localStorage.setItem('acc-db-pro', JSON.stringify(db)); setState('محفوظ محلياً 💾'); }catch(e){}

  if(!cloudReady()) return;
  if(saveBusy){ saveQueued = true; if(forceFullReplace) saveForce = true; return; }

  saveBusy = true;
  try{
    let force = forceFullReplace;
    do{
      saveQueued = false;
      const f = force || saveForce; saveForce = false; force = false;
      await pushToCloud(f);
    }while(saveQueued);
  }catch(e){
    console.warn('Save error:', e);
    setState('محفوظ محلياً (بانتظار الإنترنت 🔄)');
  }finally{
    saveBusy = false;
    setTimeout(()=>{ isSyncingFromCloud = false; }, 600);
  }
}

/* ---------- العملات والأسعار الذكية ---------- */
const symOf=c=>{const x=db.currencies.find(k=>k.code===c);return x?x.symbol:c};

function rawSymRate(code, date){
  if(code===BASE) return 1;
  const has=Object.keys(db.rates||{}).filter(d=>db.rates[d] && num(db.rates[d][code])>0).sort();
  const upTo=has.filter(d=>d<=date);
  const pick=upTo.length?upTo[upTo.length-1]:(has.length?has[has.length-1]:null);
  return pick ? num(db.rates[pick][code]) : 0;
}

function symRate(code, date){
  if(code===BASE) return 1;
  let r = rawSymRate(code, date);
  if(r > 0) return r;
  if(code==='USD') r = rawSymRate('USDT', date);
  else if(code==='USDT') r = rawSymRate('USD', date);
  if(r > 0) return r;
  if(code==='USD' || code==='USDT'){
    if(num(db.settings.fxBuyRate)>0) return num(db.settings.fxBuyRate);
    const sorted = [...(db.tx||[])].sort((a,b)=>a.ts<b.ts?1:-1);
    for(const t of sorted){
      if((t.cur==='USD'||t.cur==='USDT') && t.settle==='SYP' && num(t.rate)>1){
        return num(t.rate);
      }
      if((t.isUsdt || (t.isSham && t.cur==='USD')) && num(t.amount)>0 && Array.isArray(t.splits)){
        const sypSplit = t.splits.find(s=>s.cur==='SYP' && num(s.amount)>0);
        if(sypSplit && t.splits.length===1){
          return r2(num(sypSplit.amount) / num(t.amount));
        }
      }
    }
  }
  return 0;
}

function cross(from,to,date){
  if(from===to) return 1;
  if((from==='USD'&&to==='USDT')||(from==='USDT'&&to==='USD')){
    const a=symRate(from,date), b=symRate(to,date);
    return (a&&b)?a/b:1;
  }
  const a=symRate(from,date), b=symRate(to,date);
  return (a&&b)?a/b:0;
}
const prec=n=>Number(Number(n).toPrecision(8));

function toUSD(amt, cur, dateStr){
  const v = num(amt);
  if(!v) return 0;
  if(cur === 'USD' || cur === 'USDT') return v;
  const r = cross(cur, 'USD', dateStr || todayStr());
  return r > 0 ? v * r : 0;
}

function toSYP(amt, cur, dateStr){
  const v = num(amt);
  if(!v) return 0;
  if(cur === 'SYP') return v;
  const r = symRate(cur, dateStr || todayStr());
  return r > 0 ? v * r : 0;
}

function getTopCustomers(limit=3){
  const counts = {};
  (db.tx || []).forEach(t=>{
    if(t.cust) counts[t.cust] = (counts[t.cust]||0) + 1;
    if(t.isJournal && Array.isArray(t.lines)){
      t.lines.forEach(l=>{ if(l.targetType==='cust' && l.targetId) counts[l.targetId] = (counts[l.targetId]||0) + 1; });
    }
  });
  return [...db.customers]
    .sort((a,b)=>(counts[b.id]||0) - (counts[a.id]||0))
    .slice(0, limit);
}

/* ---------- حسابات الصناديق والأرباح والديون والأصول والمصاريف ---------- */
function boxBalUpTo(b, maxDateStr){
  let s=num(b.open);
  db.tx.forEach(t=>{
    if(maxDateStr && String(t.ts||'').slice(0,10) > maxDateStr) return;
    if(t.payMethod === 'credit') return;
    if(t.box===b.id){
      s+=t.type==='in'?t.settleAmt:-t.settleAmt;
    }
    if(Array.isArray(t.splits)){
      t.splits.forEach(sp=>{
        if(sp.box===b.id && num(sp.amount)>0){
          s+=(sp.dir==='in'?1:-1)*num(sp.amount);
        }
      });
    }
    if(t.isTransfer){
      if(t.fromBox===b.id) s-=num(t.amount);
      if(t.toBox===b.id) s+=num(t.settleAmt || t.amount);
    }
    if(t.isJournal && Array.isArray(t.lines)){
      t.lines.forEach(ln=>{
        if(ln.targetType==='box' && ln.targetId===b.id){
          s += num(ln.debit) - num(ln.credit);
        }
      });
    }
  });
  if(Array.isArray(db.expenses)){
    db.expenses.forEach(ex=>{
      if(maxDateStr && String(ex.date||'').slice(0,10) > maxDateStr) return;
      if(ex.box === b.id && num(ex.amount)>0){
        s -= num(ex.amount);
      }
    });
  }
  if(Array.isArray(db.otherRevenues)){
    db.otherRevenues.forEach(rv=>{
      if(maxDateStr && String(rv.date||'').slice(0,10) > maxDateStr) return;
      if(rv.box === b.id && num(rv.amount)>0){
        s += num(rv.amount);
      }
    });
  }
  if(Array.isArray(db.assets)){
    db.assets.forEach(as=>{
      if(maxDateStr && String(as.date||'').slice(0,10) > maxDateStr) return;
      if(as.fundSource === 'box' && as.box === b.id && num(as.cost)>0){
        s -= num(as.cost);
      }
    });
  }
  return r2(s);
}

function boxBal(b){
  return boxBalUpTo(b, null);
}

// حساب رصيد الزبون بدقة متناهية (بما في ذلك تصحيح 500 USDT مقابل 600$ والتحويل التلقائي لليرة -> دولار)
function custBal(id){
  const o={};
  db.tx.forEach(t=>{
    if(t.isJournal && Array.isArray(t.lines)){
      t.lines.forEach(ln=>{
        if(ln.targetType==='cust' && ln.targetId===id){
          const c = ln.cur || t.cur || BASE;
          o[c] = r2((o[c]||0) + num(ln.credit) - num(ln.debit));
        }
      });
      return;
    }
    if(t.cust!==id || t.isTransfer) return;

    // إذا تم اختيار تسجيل الحركة في دفتر الزبون بالدولار تلقائياً (مثلاً استدان 10,000 سوري تنزل بدفتره بالدولار)
    if(t.postAsUsd && num(t.usdBookAmt) !== 0){
      const uAmt = Math.abs(num(t.usdBookAmt));
      o['USD'] = r2((o['USD']||0) + (t.type==='in' ? uAmt : -uAmt));
      return;
    }

    if((t.isUsdt || t.isSham || t.isFx) && t.settledFull) return;

    // إصلاح خطأ 500 USDT مقابل 600$: الإشارة الموجبة تعني (له عندنا) والسالبة تعني (عليه دين)
    if(t.isUsdt && t.settleCur === 'USD'){
      const signedRem = r2(num(t.remUsd));
      if(Math.abs(signedRem) > 0.004){
        o['USD'] = r2((o['USD'] || 0) + signedRem);
      }
      return;
    }

    if((t.isSham || t.isFx) && !t.settledFull && num(t.remAmt) !== 0){
      const remCur = t.remCur || t.cur;
      o[remCur] = r2((o[remCur]||0) + num(t.remAmt));
      return;
    }

    o[t.cur]=r2((o[t.cur]||0)+(t.type==='in'?t.amount:-t.amount));
  });
  return o;
}

function custDebtInUSD(id){
  const b = custBal(id);
  const today = todayStr();
  let debtUsd = 0;
  Object.keys(b).forEach(cur=>{
    if(b[cur] < -0.004){
      debtUsd += toUSD(Math.abs(b[cur]), cur, today);
    }
  });
  return r2(debtUsd);
}

function netCustomersReceivableUSD(maxDateStr){
  const dRef = maxDateStr || todayStr();
  let netUsd = 0;
  db.customers.forEach(c=>{
    const o = {};
    db.tx.forEach(t=>{
      if(maxDateStr && String(t.ts||'').slice(0,10) > maxDateStr) return;
      if(t.isJournal && Array.isArray(t.lines)){
        t.lines.forEach(ln=>{
          if(ln.targetType==='cust' && ln.targetId===c.id){
            const cur = ln.cur || t.cur || BASE;
            o[cur] = r2((o[cur]||0) + num(ln.credit) - num(ln.debit));
          }
        });
        return;
      }
      if(t.cust!==c.id || t.isTransfer) return;
      if(t.postAsUsd && num(t.usdBookAmt) !== 0){
        const uAmt = Math.abs(num(t.usdBookAmt));
        o['USD'] = r2((o['USD']||0) + (t.type==='in' ? uAmt : -uAmt));
        return;
      }
      if((t.isUsdt || t.isSham || t.isFx) && t.settledFull) return;
      if(t.isUsdt && t.settleCur === 'USD'){
        const signedRem = r2(num(t.remUsd));
        if(Math.abs(signedRem) > 0.004) o['USD'] = r2((o['USD'] || 0) + signedRem);
        return;
      }
      if((t.isSham || t.isFx) && !t.settledFull && num(t.remAmt) !== 0){
        const remCur = t.remCur || t.cur;
        o[remCur] = r2((o[remCur]||0) + num(t.remAmt));
        return;
      }
      o[t.cur]=r2((o[t.cur]||0)+(t.type==='in'?t.amount:-t.amount));
    });
    Object.keys(o).forEach(cur=>{
      netUsd += toUSD(-o[cur], cur, dRef);
    });
  });
  return r2(netUsd);
}

function totalBoxesUSD(maxDateStr){
  const dRef = maxDateStr || todayStr();
  let totalUsd = 0;
  db.cashboxes.forEach(b=>{
    totalUsd += toUSD(boxBalUpTo(b, maxDateStr), b.cur, dRef);
  });
  return r2(totalUsd);
}

function workingCapitalUSD(maxDateStr){
  return r2(totalBoxesUSD(maxDateStr) + netCustomersReceivableUSD(maxDateStr));
}

function totalAssetsUSD(maxDateStr){
  let s = 0;
  if(Array.isArray(db.assets)){
    db.assets.forEach(a=>{
      if(maxDateStr && String(a.date||'').slice(0,10) > maxDateStr) return;
      s += toUSD(a.cost, a.cur || 'USD', a.date || todayStr());
    });
  }
  return r2(s);
}

function totalEnterpriseCapitalUSD(maxDateStr){
  return r2(workingCapitalUSD(maxDateStr) + totalAssetsUSD(maxDateStr));
}

// إجمالي الأرباح (أرباح العمليات + الإيرادات الإضافية الأخرى)
function totalOtherRevenuesSYP(datePrefix){
  let s = 0;
  if(Array.isArray(db.otherRevenues)){
    db.otherRevenues.forEach(rv=>{
      if(datePrefix && !(rv.date||'').startsWith(datePrefix)) return;
      const c = rv.cur || 'SYP';
      s += (c === 'SYP') ? num(rv.amount) : toSYP(rv.amount, c, rv.date || todayStr());
    });
  }
  return r2(s);
}

function totalOtherRevenuesUSD(datePrefix){
  let s = 0;
  if(Array.isArray(db.otherRevenues)){
    db.otherRevenues.forEach(rv=>{
      if(datePrefix && !(rv.date||'').startsWith(datePrefix)) return;
      const c = rv.cur || 'SYP';
      s += (c === 'USD' || c === 'USDT') ? num(rv.amount) : toUSD(rv.amount, c, rv.date || todayStr());
    });
  }
  return r2(s);
}

function totalGrossProfitSYP(datePrefix){
  let p=0;
  db.tx.forEach(t=>{
    if(datePrefix && !(t.ts||'').startsWith(datePrefix)) return;
    const v = num(t.profit);
    if(v > 0){
      const pCur = t.profitCur || 'SYP';
      const d = (t.ts || todayStr()).slice(0,10);
      p += (pCur === 'SYP') ? v : toSYP(v, pCur, d);
    }
  });
  return r2(p + totalOtherRevenuesSYP(datePrefix));
}

function totalGrossProfitUSD(datePrefix){
  let p=0;
  db.tx.forEach(t=>{
    if(datePrefix && !(t.ts||'').startsWith(datePrefix)) return;
    const v = num(t.profit);
    if(v > 0){
      const pCur = t.profitCur || 'SYP';
      const d = (t.ts || todayStr()).slice(0,10);
      p += (pCur === 'USD' || pCur === 'USDT') ? v : toUSD(v, pCur, d);
    }
  });
  return r2(p + totalOtherRevenuesUSD(datePrefix));
}

function totalExpensesSYP(datePrefix){
  let s = 0;
  if(Array.isArray(db.expenses)){
    db.expenses.forEach(ex=>{
      if(datePrefix && !(ex.date||'').startsWith(datePrefix)) return;
      const c = ex.cur || 'SYP';
      s += (c === 'SYP') ? num(ex.amount) : toSYP(ex.amount, c, ex.date || todayStr());
    });
  }
  return r2(s);
}

function totalExpensesUSD(datePrefix){
  let s = 0;
  if(Array.isArray(db.expenses)){
    db.expenses.forEach(ex=>{
      if(datePrefix && !(ex.date||'').startsWith(datePrefix)) return;
      const c = ex.cur || 'SYP';
      s += (c === 'USD' || c === 'USDT') ? num(ex.amount) : toUSD(ex.amount, c, ex.date || todayStr());
    });
  }
  return r2(s);
}

function netRealProfitSYP(){
  return r2(totalGrossProfitSYP() - totalExpensesSYP());
}

function netRealProfitUSD(){
  return r2(totalGrossProfitUSD() - totalExpensesUSD());
}

const balWord=n=>n>0.004?'له عندنا':n<-0.004?'عليه لنا':'متوازن';
const balCls=n=>n>0.004?'pos':n<-0.004?'neg':'';
function balPills(o){
  const k=Object.keys(o).filter(c=>Math.abs(o[c])>0.004);
  if(!k.length) return '<span class="sub">الحساب متوازن / لا توجد ذمم</span>';
  return k.map(c=>`<div class="balpill"><small>${esc(balWord(o[c]))}</small><b class="${balCls(o[c])} priv">${fmt(Math.abs(o[c]))} ${esc(symOf(c))}</b></div>`).join('');
}

/* =====================================================================
   بطاقة مقارنة رصيد الأمس باليوم وتحليل الزيادة أو النقصان (كشف الضياع)
   ===================================================================== */
function renderYesterdayVsTodayCard(){
  const today = todayStr();
  const yest = yesterdayStr();

  // رصيد الأمس الكلي (إغلاق نهاية يوم أمس)
  const yestCapUsd = totalEnterpriseCapitalUSD(yest);
  const todayCapUsd = totalEnterpriseCapitalUSD(null);
  const diffCapUsd = r2(todayCapUsd - yestCapUsd);

  // رصيد صناديق النقد والسيولة بين أمس واليوم
  const yestBoxesUsd = totalBoxesUSD(yest);
  const todayBoxesUsd = totalBoxesUSD(null);
  const diffBoxesUsd = r2(todayBoxesUsd - yestBoxesUsd);

  // أرباح وإيرادات ومصاريف اليوم
  const todayRevUsd = totalGrossProfitUSD(today);
  const todayExpUsd = totalExpensesUSD(today);
  const expectedChangeUsd = r2(todayRevUsd - todayExpUsd);

  // صافي دخول/خروج دولار إضافي (فرق سيولة الصناديق غير الناتج عن الأرباح الصافية، مثل ديون أو ضخ رأس مال أو فروقات تصريف)
  const extraFlowUsd = r2(diffBoxesUsd - expectedChangeUsd);

  // فحص جرد الصناديق اليوم للكشف عن أي عجز / ضياع فعلي في الدرج
  const openShortages = (db.stocktakes || []).filter(st => st.date === today && st.status === 'open' && Math.abs(num(st.diff)) >= 0.005);
  let alertHtml = '';
  if(openShortages.length){
    alertHtml = openShortages.map(st=>{
      const bx = db.cashboxes.find(b=>b.id===st.box);
      const isLoss = num(st.diff) < 0;
      return `<div class="warn-box" style="margin-top:8px;background:var(--out-bg);color:var(--out);border-color:var(--out);cursor:pointer" onclick="openDiffFinder('${st.id}')">
        🚨 تنبيه جرد فعلي في (${esc(bx?bx.name:'الصندوق')}): يوجد ${isLoss?'نقص / ضياع':'زيادة غير مفسرة'} بقيمة <b>${fmt(Math.abs(st.diff))} ${esc(symOf(st.cur))}</b> — اضغط للتدقيق العكسي فوراً!
      </div>`;
    }).join('');
  } else if(diffCapUsd < -0.5 && todayExpUsd === 0){
    alertHtml = `<div class="warn-box" style="margin-top:8px;cursor:pointer" onclick="openStocktake()">
      ⚠️ تنبيه: إجمالي رصيدك اليوم انخفض بمقدار <b>$${fmt(Math.abs(diffCapUsd))}</b> عن الأمس بدون تسجيل مصاريف! اضغط هنا لجرد الصناديق والتأكد من عدم وجود ضياع.
    </div>`;
  }

  let reasonText = '';
  if(Math.abs(diffCapUsd) < 0.01){
    reasonText = 'الرصيد الكلي مستقر تماماً مقارنة بنهاية يوم أمس.';
  } else if(diffCapUsd > 0){
    reasonText = `زيادة بمقدار <b class="pos">+$${fmt(diffCapUsd)}</b>: منها <b>+$${fmt(todayRevUsd)}</b> إيرادات وأرباح اليوم، و <b>${extraFlowUsd>=0?'+':''}$${fmt(extraFlowUsd)}</b> حركة سيولة/ذمم إضافية.`;
  } else {
    reasonText = `انخفاض بمقدار <b class="neg">-$${fmt(Math.abs(diffCapUsd))}</b>: مصاريف اليوم <b>$${fmt(todayExpUsd)}</b>، وفروقات حركة/تقويم <b>$${fmt(r2(diffCapUsd + todayExpUsd))}</b>.`;
  }

  return `<div class="card" style="border-right:4px solid var(--accent-2);margin-bottom:12px">
    <div class="top">
      <b style="font-size:14.5px;color:var(--accent-2)">📈 مقارنة الرصيد (الأمس مقابل اليوم) وتحليل الفروقات</b>
      <span class="tag ${diffCapUsd>=0?'in':'out'} priv">${diffCapUsd>=0?'+':''}$${fmt(diffCapUsd)}</span>
    </div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:8px;text-align:center">
      <div style="background:var(--bg);padding:8px;border-radius:10px">
        <div class="sub" style="font-size:11.5px">رصيد إغلاق الأمس</div>
        <b class="priv" style="font-size:16px">$${fmt(yestCapUsd)}</b>
      </div>
      <div style="background:var(--bg);padding:8px;border-radius:10px">
        <div class="sub" style="font-size:11.5px">الرصيد الحالي اليوم</div>
        <b class="priv" style="font-size:16px">$${fmt(todayCapUsd)}</b>
      </div>
      <div style="background:var(--bg);padding:8px;border-radius:10px">
        <div class="sub" style="font-size:11.5px">سيولة الصناديق اليوم</div>
        <b class="priv ${diffBoxesUsd>=0?'pos':'neg'}" style="font-size:16px">${diffBoxesUsd>=0?'+':''}$${fmt(diffBoxesUsd)}</b>
      </div>
    </div>
    <div class="sub" style="margin-top:8px;line-height:1.6">🔍 <b>تحليل الحركة:</b> ${reasonText}</div>
    ${alertHtml}
  </div>`;
}

function onFxUsdInput(v){
  FX.usdAmt = v;
  const u = num(v), r = num(FX.rate);
  FX.sypAmt = (u>0 && r>0) ? r2(u*r) : '';
  if($('#fxSypAmt')) $('#fxSypAmt').value = FX.sypAmt;
  calcFxAutoProfit();
}
function onFxRateInput(v){
  FX.rate = v;
  const u = num(FX.usdAmt), r = num(v);
  FX.sypAmt = (u>0 && r>0) ? r2(u*r) : '';
  if($('#fxSypAmt')) $('#fxSypAmt').value = FX.sypAmt;
  calcFxAutoProfit();
}
function onFxSypInput(v){
  FX.sypAmt = v;
  const u = num(FX.usdAmt), s = num(v);
  if(u>0 && s>0){
    FX.rate = prec(s/u);
    if($('#fxRate')) $('#fxRate').value = FX.rate;
  }
  calcFxAutoProfit();
}

function calcFxAutoProfit(){
  if(!FX.autoProfit) return;
  const u = num(FX.usdAmt), r = num(FX.rate);
  if(u <= 0 || r <= 0){ FX.profit = ''; if($('#fxProfit')) $('#fxProfit').value=''; return; }
  const buyR = num(db.settings.fxBuyRate)||149;
  const sellR = num(db.settings.fxSellRate)||150;
  const midR = (buyR + sellR) / 2;
  const diffPerUsd = FX.mode === 'buy_usd' ? Math.max(0, midR - r) : Math.max(0, r - midR);
  const p = r2(u * diffPerUsd);
  FX.profit = p > 0 ? p : '';
  if($('#fxProfit')) $('#fxProfit').value = FX.profit;
}

function saveFxTx(){
  const err = m => { const e=$('#fxErr'); e.textContent=m; e.style.display='block'; };
  if(!canAddOnDate(FX.ts)) return err('هذا التاريخ مقفل من قِبل المدير.');
  const u = num(FX.usdAmt), s = num(FX.sypAmt), r = num(FX.rate);
  if(u <= 0 || s <= 0) return err('أدخل مبلغ الدولار ومبلغ الليرة السورية');
  const isBuy = FX.mode === 'buy_usd';
  const sypBoxObj = db.cashboxes.find(b=>b.id===FX.sypBox);

  const splits = [{
    box: FX.sypBox,
    cur: 'SYP',
    label: sypBoxObj ? sypBoxObj.name : 'صندوق الليرة',
    amount: r2(s),
    dir: isBuy ? 'out' : 'in'
  }];

  const rec = {
    id: FX.id || uid(),
    isFx: true,
    fxMode: FX.mode,
    fxUsdBox: FX.usdBox,
    fxSypBox: FX.sypBox,
    type: isBuy ? 'in' : 'out',
    cust: FX.cust || '',
    ts: FX.ts || nowLocal(),
    amount: r2(u),
    cur: 'USD',
    settle: 'USD',
    rate: r,
    settleAmt: r2(u),
    box: FX.usdBox,
    splits,
    settledFull: FX.settledFull,
    autoProfit: FX.autoProfit,
    profit: isManager() ? r2(num(FX.profit)) : 0,
    profitCur: FX.profitCur || 'SYP',
    note: (FX.note||'').trim() || (isBuy ? `شراء دولار بسعر ${r}` : `تصريف دولار بسعر ${r}`),
    _u: Date.now()
  };

  if(FX.id){ const i=db.tx.findIndex(t=>t.id===FX.id); db.tx[i]=rec; }
  else db.tx.push(rec);
  save(); closeSheet(); render();
}

/* ---------- كشف متوسط سعر الشراء وإجمالي السوري المترتب ---------- */
function renderAvgPurchaseReport(){
  const purchases = [];
  db.tx.forEach(t=>{
    if(ui.avgFrom && String(t.ts||'').slice(0,10) < ui.avgFrom) return;
    if(ui.avgTo && String(t.ts||'').slice(0,10) > ui.avgTo) return;

    // 1) عمليات التصريف السريع: شراء دولار مقابل سوري
    if(t.isFx && t.fxMode === 'buy_usd' && num(t.amount)>0 && num(t.settleAmt)>0){
      purchases.push({
        id: t.id, ts: t.ts, usd: num(t.amount), syp: num(t.settleAmt),
        rate: r2(num(t.settleAmt)/num(t.amount)), label: 'تصريف: شراء $'
      });
    }
    // 2) العمليات العادية: شراء دولار أو USDT مقابل سوري (type==='out' و cur==='USD' و settle==='SYP')
    else if(!t.isFx && !t.isUsdt && !t.isSham && !t.isJournal && !t.isTransfer && t.type==='out' && (t.cur==='USD'||t.cur==='USDT') && t.settle==='SYP' && num(t.amount)>0 && num(t.settleAmt)>0){
      purchases.push({
        id: t.id, ts: t.ts, usd: num(t.amount), syp: num(t.settleAmt),
        rate: r2(num(t.settleAmt)/num(t.amount)), label: 'شراء ' + t.cur
      });
    }
    // 3) شراء USDT مقابل سوري بالكامل
    else if(t.isUsdt && t.type==='in' && num(t.amount)>0 && Array.isArray(t.splits)){
      const sypOnly = t.splits.every(s=>s.cur==='SYP');
      const totSyp = t.splits.reduce((acc,s)=>acc + (s.cur==='SYP'?num(s.amount):0), 0);
      if(sypOnly && totSyp > 0){
        purchases.push({
          id: t.id, ts: t.ts, usd: num(t.amount), syp: totSyp,
          rate: r2(totSyp/num(t.amount)), label: 'شراء USDT بالسوري'
        });
      }
    }
  });

  purchases.sort((a,b)=>a.ts<b.ts?1:-1);
  const totUsd = r2(purchases.reduce((a,b)=>a+b.usd, 0));
  const totSyp = r2(purchases.reduce((a,b)=>a+b.syp, 0));
  const weightedAvg = totUsd > 0 ? r2(totSyp / totUsd) : 0;

  return `<div class="card" style="border-top:4px solid var(--accent-2);margin-top:10px">
    <div class="top">
      <b>📈 كشف الإجمالي الكلي ومتوسط سعر الشراء</b>
      <button class="chip" onclick="ui.avgFrom='';ui.avgTo='';render()">كل الأوقات</button>
    </div>
    <div class="row2" style="margin-top:8px">
      <div><label style="margin:0 0 2px;font-size:12px">من تاريخ</label><input type="date" value="${esc(ui.avgFrom)}" onchange="ui.avgFrom=this.value;render()"></div>
      <div><label style="margin:0 0 2px;font-size:12px">إلى تاريخ</label><input type="date" value="${esc(ui.avgTo)}" onchange="ui.avgTo=this.value;render()"></div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:12px;text-align:center">
      <div class="box" style="background:var(--in-bg)">
        <div class="nm">إجمالي الدولار المشتراة</div>
        <div class="bal pos">$ ${fmt(totUsd)}</div>
      </div>
      <div class="box" style="background:var(--warn-bg)">
        <div class="nm">السعر الوسطي المرجح</div>
        <div class="bal" style="color:var(--warn)">${fmt(weightedAvg)} ل.س</div>
      </div>
      <div class="box" style="background:var(--out-bg)">
        <div class="nm">إجمالي السوري المدفوع/المترتب</div>
        <div class="bal neg">${fmt(totSyp)} ل.س</div>
      </div>
    </div>

    <h2 style="font-size:14px;margin-top:14px">تفصيل صفقات الشراء الداخلة في المتوسط (${purchases.length}):</h2>
    ${purchases.length ? purchases.map(p=>`<div class="st-row" onclick="txMenu('${p.id}')" style="cursor:pointer">
      <div class="st-line"><b>${esc(p.label)}: $${fmt(p.usd)}</b><span class="when">${p.ts.slice(0,16).replace('T',' ')}</span></div>
      <div class="st-line"><span>سعر الشراء: <b>${fmt(p.rate)} ل.س</b></span><b class="neg">${fmt(p.syp)} ل.س</b></div>
    </div>`).join('') : '<div class="empty">لا توجد عمليات شراء دولار/USDT مقابل ليرة سورية ضمن هذه الفترة.</div>'}
  </div>`;
}

function syncOtherRevBoxes(cur, selBox){
  const boxes = db.cashboxes.filter(b=>b.cur===cur);
  const el = $('#rvBox');
  if(!el) return;
  const targetBox = selBox !== undefined ? selBox : (boxes[0]?.id || '');
  el.innerHTML = `<option value="" ${targetBox===''?'selected':''}>-- ربح دفتري فقط (بدون زيادة صندوق) --</option>` +
    boxes.map(b=>`<option value="${b.id}" ${b.id===targetBox?'selected':''}>${esc(b.name)} (${fmt(boxBal(b))} ${symOf(b.cur)})</option>`).join('');
}

function saveOtherRev(id){
  const err = m => { const e=$('#rvErr'); e.textContent=m; e.style.display='block'; };
  const dateVal = $('#rvDate').value || todayStr();
  if(!canAddOnDate(dateVal)) return err('هذا التاريخ مقفل. افتح قفل اليوم أولاً.');
  const title = $('#rvTitle').value.trim();
  const amt = num($('#rvAmt').value);
  if(!title) return err('اكتب بيان الإيراد');
  if(amt <= 0) return err('اكتب مبلغ الإيراد');

  const rec = {
    id: id || uid(),
    title,
    cat: $('#rvCat').value,
    amount: r2(amt),
    cur: $('#rvCur').value,
    box: $('#rvBox').value,
    date: dateVal,
    note: $('#rvNote').value.trim(),
    _u: Date.now()
  };

  if(id){
    const idx = db.otherRevenues.findIndex(x=>x.id===id);
    if(idx>=0) db.otherRevenues[idx] = rec;
  } else {
    db.otherRevenues.push(rec);
  }
  ui.capTab = 'revenues';
  save(); closeSheet(); render();
}

function delOtherRev(id){
  const rv = db.otherRevenues.find(x=>x.id===id);
  if(rv && !canAddOnDate(rv.date)){
    const e=$('#rvErr'); if(e){e.textContent='هذا التاريخ مقفل، افتح القفل أولاً للحذف.';e.style.display='block';}
    return;
  }
  markDeleted(id);
  db.otherRevenues = db.otherRevenues.filter(x=>x.id!==id);
  save(); closeSheet(); render();
}

function saveExpense(id){
  const err = m => { const e=$('#exErr'); e.textContent=m; e.style.display='block'; };
  const dateVal = $('#exDate').value || todayStr();
  if(!canAddOnDate(dateVal)) return err('هذا التاريخ مقفل. افتح قفل اليوم أولاً.');
  const title = $('#exTitle').value.trim();
  const amt = num($('#exAmt').value);
  if(!title) return err('اكتب بيان المصروف');
  if(amt <= 0) return err('اكتب مبلغ المصروف');

  const rec = {
    id: id || uid(), title, cat: $('#exCat').value, amount: r2(amt),
    cur: $('#exCur').value, box: $('#exBox').value, date: dateVal,
    note: $('#exNote').value.trim(), _u: Date.now()
  };

  if(id){ const idx = db.expenses.findIndex(x=>x.id===id); if(idx>=0) db.expenses[idx] = rec; }

  ui.capTab = 'expenses';

function updateQuickCalcOnly(){
  const today = todayStr();
  const autoR = prec(cross(ui.calcFrom, ui.calcTo, today)) || 0;
  const activeR = ui.calcRate !== '' ? num(ui.calcRate) : num(autoR);
  const amt = num(ui.calcAmt);
  const res = (amt > 0 && activeR > 0) ? r2(amt * activeR) : 0;
  const el = $('#qcRes');
  if(el) el.textContent = `${fmt(res)} ${symOf(ui.calcTo)}`;
}

function adoptCalcAsTx(){
  const today = todayStr();
  const autoR = prec(cross(ui.calcFrom, ui.calcTo, today)) || 0;
  const activeR = ui.calcRate !== '' ? num(ui.calcRate) : num(autoR);
  const amt = num(ui.calcAmt);
  const res = (amt > 0 && activeR > 0) ? r2(amt * activeR) : 0;
  openTx();
  setTimeout(()=>{
    F.cur = ui.calcFrom;
    F.settle = ui.calcTo;
    F.amount = amt || '';
    F.rate = activeR || '';
    F.settleAmt = res || '';
    F.manual = true;
    autoBox();
    syncForm();
    if($('#fAmt')) $('#fAmt').value = F.amount;
    if($('#fCur')) $('#fCur').value = F.cur;
    if($('#fSet')) $('#fSet').value = F.settle;
  }, 30);
}

let pulling = false, lastPull = 0;
async function manualSqlPull(){
  if(!sbClient || pulling || saveBusy) return;
  if(Date.now() - lastPull < 2000) return;
  pulling = true; lastPull = Date.now();
  try{
    const d = await loadDB();
    if(d){
      const currentRole = db.settings ? db.settings.role : 'manager';
      db = d;
      ensureDefaults();
      db.settings.role = currentRole;
      rebaseSnaps();
      render();
      if(hasPendingLocalChanges && cloudReady()) save();
    }
  }finally{
    pulling = false;
  }
}

function onJournalAmtInput(idx, field, val){
  J.lines[idx][field] = val;
  if(num(val) > 0){
    const other = field === 'debit' ? 'credit' : 'debit';
    J.lines[idx][other] = '';
    const dEl = $(`#jd_${other==='debit'?'d':'c'}_${idx}`);
    const mEl = $(`#jm_${other==='debit'?'d':'c'}_${idx}`);
    if(dEl) dEl.value = '';
    if(mEl) mEl.value = '';
  }
  updateJournalTotals();
}
function setJournalLineAcc(idx, val){
  if(!val){ J.lines[idx].targetType = ''; J.lines[idx].targetId = ''; render(); return; }
  const [tp, id] = val.split(':');
  J.lines[idx].targetType = tp; J.lines[idx].targetId = id;
  if(tp === 'box'){ const b = db.cashboxes.find(x=>x.id===id); if(b) J.lines[idx].cur = b.cur; }
  render();
}
function addJournalLine(){ J.lines.push({ targetType:'', targetId:'', note:'', debit:'', credit:'', cur:J.cur }); render(); }
function removeJournalLine(idx){ if(J.lines.length <= 1) return; J.lines.splice(idx, 1); render(); }
function autoBalanceJournal(){
  let d = 0, c = 0;
  J.lines.forEach((l, i)=>{ if(i === J.lines.length - 1) return; d += num(l.debit); c += num(l.credit); });
  const last = J.lines[J.lines.length - 1];
  if(d > c){ last.credit = r2(d - c); last.debit = ''; }
  else if(c > d){ last.debit = r2(c - d); last.credit = ''; }
  render();
}
function updateJournalTotals(){
  let totalDebit = 0, totalCredit = 0;
  J.lines.forEach(l=>{ totalDebit = r2(totalDebit + num(l.debit)); totalCredit = r2(totalCredit + num(l.credit)); });
  const diff = r2(totalDebit - totalCredit);
  if($('#jTotD')) $('#jTotD').textContent = fmt(totalDebit);
  if($('#jTotC')) $('#jTotC').textContent = fmt(totalCredit);
  if($('#jDiffBox')) $('#jDiffBox').innerHTML = Math.abs(diff)<0.005 ? `<span class="tag in">السند متوازن 100% ✓</span>` : `<span class="tag out">الفرق: ${fmt(Math.abs(diff))}</span>`;
}
function saveJournalVoucher(){
  const err = m => { const e=$('#jErr'); if(e){ e.textContent=m; e.style.display='block'; } };
  if(!canAddOnDate(J.date)) return err('هذا التاريخ مقفل من قِبل المدير.');
  const validLines = J.lines.filter(l => l.targetId && (num(l.debit)>0 || num(l.credit)>0));
  if(!validLines.length) return err('أدخل سطراً واحداً على الأقل مع تحديد الحساب والمبلغ.');
  let totD = 0, totC = 0; const byCur = {};
  validLines.forEach(l => {
    const dAmt = num(l.debit), cAmt = num(l.credit);
    totD += dAmt; totC += cAmt;
    let lc = l.cur || J.cur || BASE;
    if(l.targetType==='box'){ const bx = db.cashboxes.find(x=>x.id===l.targetId); if(bx) lc = bx.cur; }
    if(!byCur[lc]) byCur[lc] = { d: 0, c: 0 };
    byCur[lc].d = r2(byCur[lc].d + dAmt); byCur[lc].c = r2(byCur[lc].c + cAmt);
  });
  const curKeys = Object.keys(byCur);
  if(curKeys.length === 1){
    const k = curKeys[0];
    if(Math.abs(byCur[k].d - byCur[k].c) >= 0.005) return err(`السند غير متوازن بعملة ${k} (مدين ${fmt(byCur[k].d)} مقابل دائن ${fmt(byCur[k].c)}).`);
  }
  const maxAmt = r2(Math.max(totD, totC));
  const rec = {
    id: J.id || uid(), isJournal: true, voucherNo: J.voucherNo, date: J.date,
    ts: J.date + 'T' + nowLocal().slice(11), cur: J.cur, rate: num(J.rate) || 1,
    amount: maxAmt, type: 'in', profit: isManager() ? r2(num(J.profit)) : 0, profitCur: J.profitCur || 'SYP',
    lines: validLines.map(l=>{
      let lineCur = l.cur || J.cur;
      if(l.targetType==='box'){ const b = db.cashboxes.find(x=>x.id===l.targetId); if(b) lineCur = b.cur; }
      return { targetType: l.targetType, targetId: l.targetId, note: (l.note||'').trim(), debit: r2(num(l.debit)), credit: r2(num(l.credit)), cur: lineCur };
    }),
    note: `سند يومية رقم #${J.voucherNo} (${validLines.length} أسطر)`, _u: Date.now()
  };
  if(J.id){ const idx = db.tx.findIndex(t=>t.id===J.id); if(idx >= 0) db.tx[idx] = rec; }
  else { db.tx.push(rec); db.voucherSeq = (db.voucherSeq || 1001) + 1; }
  save(); initJournalState(); go('ops');
}

function evalShamTotals(){
  const a = num(S.amount);
  const wCur = S.shamWallet === 'b_sham_syp' ? 'SYP' : 'USD';
  const dStr = (S.ts || todayStr()).slice(0,10);
  const baseUsd = toUSD(a, wCur, dStr);

  let counterInBaseCur = 0;
  let counterUsd = 0;
  const parts = [];
  SHAM_COUNTER_METHODS.forEach(m=>{
    if(m.box === S.shamWallet) return;
    const v = num(S.sp[m.key]);
    if(v > 0){
      parts.push(`${fmt(v)} ${symOf(m.cur)} (${m.label})`);
      counterUsd = r2(counterUsd + toUSD(v, m.cur, dStr));
      if(m.cur === wCur) counterInBaseCur = r2(counterInBaseCur + v);
      else if(wCur === 'SYP') counterInBaseCur = r2(counterInBaseCur + toSYP(v, m.cur, dStr));
      else counterInBaseCur = r2(counterInBaseCur + toUSD(v, m.cur, dStr));
    }
  });

  // حساب الفرق في نفس عملة المحفظة الأساسية
  const diffBase = S.type === 'in' ? r2(a - counterInBaseCur) : r2(counterInBaseCur - a);
  const absDiffUsd = Math.abs(r2(baseUsd - counterUsd));
  const diffPct = baseUsd > 0 ? (absDiffUsd / baseUsd) * 100 : 0;

  return { a, wCur, baseUsd, counterUsd, counterInBaseCur, diffBase, absDiffUsd, diffPct, parts };
}

function syncShamSum(){
  const el = $('#sSum'); if(!el) return;
  const ev = evalShamTotals();
  if(!ev.a && !ev.parts.length){ el.textContent=''; }
  else {
    el.textContent = `${fmt(ev.a)} ${symOf(ev.wCur)} شام كاش` + (ev.parts.length ? ` ⬅️ ${ev.parts.join(' + ')}` : '');
  }

  // احتساب الربح التلقائي عند وجود فرق عمولة منطقي (مثلاً استلام 5000 وتسليم 4950)
  if(S.autoProfit && ev.a > 0 && ev.parts.length > 0){
    const autoP = ev.diffBase > 0 ? ev.diffBase : 0;
    S.profit = autoP > 0 ? autoP : '';
    if($('#sProfit')) $('#sProfit').value = S.profit;
  }

  // تنبيه وحماية الخطأ (> 1%) إذا كانت العملية مسددة بالكامل ولم يكن الفرق عمولة ربح معتمدة
  const guardEl = $('#sGuardAlert');
  const saveBtn = $('#sSaveBtn');
  const profitInBase = (S.profitCur === ev.wCur) ? num(S.profit) : (ev.wCur==='SYP'?toSYP(num(S.profit),S.profitCur,todayStr()):toUSD(num(S.profit),S.profitCur,todayStr()));
  const netUnexplainedBase = Math.abs(r2(ev.diffBase - profitInBase));
  const netUnexplainedUsd = toUSD(netUnexplainedBase, ev.wCur, todayStr());
  const unexplainedPct = ev.baseUsd > 0 ? (netUnexplainedUsd / ev.baseUsd) * 100 : 0;

  if(guardEl && saveBtn){
    if(S.settledFull && ev.a > 0 && ev.parts.length > 0 && unexplainedPct > 1.01){
      guardEl.innerHTML = `<div class="warn-box" style="background:var(--out-bg);color:var(--out);border-color:var(--out)">
        ⛔ تنبيه خطأ إدخال: يوجد فرق غير مفسر بقيمة <b>${fmt(netUnexplainedBase)} ${symOf(ev.wCur)}</b> (${unexplainedPct.toFixed(1)}% وهو أكبر من 1%)! صحح المبالغ أو ألغِ خيار "مسددة بالكامل" لتسجيله كدين على زبون.
      </div>`;
      saveBtn.disabled = true;
      saveBtn.style.opacity = '0.5';
    } else {
      guardEl.innerHTML = '';
      saveBtn.disabled = false;
      saveBtn.style.opacity = '1';
    }
  }
}

function saveShamTx(){
  const err = m => { const e=$('#sErr'); e.textContent=m; e.style.display='block'; };
  if(!canAddOnDate(S.ts)) return err('هذا التاريخ مقفل من قِبل المدير.');
  const ev = evalShamTotals();
  if(ev.a <= 0) return err('اكتب مبلغ الشام كاش');

  const oppDir = S.type === 'in' ? 'out' : 'in';
  const splits = [];
  SHAM_COUNTER_METHODS.forEach(m=>{
    if(m.box === S.shamWallet) return;
    const v = r2(num(S.sp[m.key]));
    if(v > 0){
      splits.push({box:m.box, cur:m.cur, label:m.label, amount:v, dir:oppDir});
    }
  });

  // إذا كانت غير مسددة بالكامل، نحسب المتبقي للزبون بدقة (موجب = له عندنا، سالب = عليه دين)
  const profitInBase = (S.profitCur === ev.wCur) ? num(S.profit) : (ev.wCur==='SYP'?toSYP(num(S.profit),S.profitCur,todayStr()):toUSD(num(S.profit),S.profitCur,todayStr()));
  let signedRem = 0;
  if(!S.settledFull){
    if(!S.cust) return err('اختر الزبون لتسجيل الباقي كدين/رصيد في حسابه.');
    // إذا استلمنا شام كاش (in): للزبون صافي بعد الربح، ناقص ما سلمناه
    // إذا سلمنا شام كاش (out): على الزبون المبلغ + الربح، ناقص ما استلمناه
    signedRem = S.type === 'in'
      ? r2((ev.a - profitInBase) - ev.counterInBaseCur)
      : r2(ev.counterInBaseCur - (ev.a + profitInBase));
  }

  const rec = {
    id: S.id || uid(),
    isSham: true,
    type: S.type,
    cust: S.cust || '',
    ts: S.ts || nowLocal(),
    amount: r2(ev.a),
    cur: ev.wCur,
    settle: ev.wCur,
    rate: 1,
    settleAmt: r2(ev.a),
    box: S.shamWallet,
    splits,
    settledFull: S.settledFull,
    remAmt: S.settledFull ? 0 : signedRem,
    remCur: ev.wCur,
    autoProfit: S.autoProfit,
    profit: isManager() ? r2(num(S.profit)) : 0,
    profitCur: S.profitCur || ev.wCur,
    note: (S.note||'').trim(),
    _u: Date.now()
  };
  if(S.id){ const i=db.tx.findIndex(t=>t.id===S.id); db.tx[i]=rec; }
  else db.tx.push(rec);
  save(); closeSheet(); render();
}

    return `<span class="split-badge">${esc(dirTxt + nm)}: <b>${fmt(sp.amount)} ${esc(symOf(sp.cur))}</b></span>`;
  }).join(' ');

}

      ${t.isSham?'<span class="tag sham">شام كاش</span>':''}
      ${isManager() && num(t.profit)>0 ? `<span class="tag profit priv">ربح: ${fmt(t.profit)} ${esc(pCurSym)}</span>`:''}
      <b>${showCust?esc(c?c.name:(t.isAdjust?'تسوية فرق جرد':t.isJournal?'قيد يومية متعدد':'عملية عامة')):''}${lockedIcon}</b>

    </div>
    ${!t.isTransfer && !t.isJournal?`<div class="tx-amt ${isIn?'in':'out'}">${isIn?'+':'−'}${fmt(t.amount)} ${esc(symOf(t.cur))}</div>`:
    `<div class="tx-amt" style="color:var(--accent-2)">${t.isJournal?'قيمة السند: ':'تحويل '}${fmt(t.amount)} ${esc(symOf(t.cur||BASE))}</div>`}

    ${t.postAsUsd && num(t.usdBookAmt)>0?`<div class="sub" style="color:var(--accent-2);font-weight:700">📌 رُحّلت لدفتر الزبون بالدولار: $${fmt(t.usdBookAmt)} (سعر ${fmt(t.bookFxRate)})</div>`:''}
    ${b&&!t.isTransfer&&!t.isJournal&&t.payMethod!=='credit'?`<div class="sub">الصندوق: ${esc(b.name)}</div>`:''}

}

function inDateRange(ts, fromD, toD){
  const d = String(ts||'').slice(0,10);
  if(fromD && d < fromD) return false;
  if(toD && d > toD) return false;
  return true;
}

function getBoxOrCurMovements(boxId, fromD, toD){
  const b = db.cashboxes.find(x=>x.id===boxId);
  if(!b) return { inList:[], outList:[], totalIn:0, totalOut:0, openBal:0, netBal:0, box:null };
  const inList = [], outList = [];
  let totalIn = 0, totalOut = 0;

  db.tx.forEach(t=>{
    if(!inDateRange(t.ts, fromD, toD)) return;
    if(t.payMethod === 'credit') return;
    const c = db.customers.find(x=>x.id===t.cust);
    const party = c ? c.name : (t.isAdjust ? 'تسوية فرق جرد' : t.isJournal ? `سند يومية #${t.voucherNo}` : (t.isTransfer ? 'تحويل داخلي' : (t.isFx?'تصريف $':'عملية عامة')));

    if(t.box === b.id && !t.isTransfer && !t.isJournal){
      const amt = r2(num(t.settleAmt || t.amount));
      if(t.type === 'in'){ totalIn = r2(totalIn + amt); inList.push({id:t.id, ts:t.ts, amt, party, note:t.note||''}); }
      else { totalOut = r2(totalOut + amt); outList.push({id:t.id, ts:t.ts, amt, party, note:t.note||''}); }
    }
    if(Array.isArray(t.splits)){
      t.splits.forEach(sp=>{
        if(sp.box === b.id && num(sp.amount)>0){
          const amt = r2(num(sp.amount));
          if(sp.dir === 'in'){ totalIn = r2(totalIn + amt); inList.push({id:t.id, ts:t.ts, amt, party, note:t.note||'مقابل عملية مركبة'}); }
          else { totalOut = r2(totalOut + amt); outList.push({id:t.id, ts:t.ts, amt, party, note:t.note||'مقابل عملية مركبة'}); }
        }
      });
    }
    if(t.isTransfer){
      if(t.fromBox === b.id){ const amt = r2(num(t.amount)); totalOut = r2(totalOut + amt); outList.push({id:t.id, ts:t.ts, amt, party:'تحويل صادر', note:t.note||''}); }
      if(t.toBox === b.id){ const amt = r2(num(t.settleAmt||t.amount)); totalIn = r2(totalIn + amt); inList.push({id:t.id, ts:t.ts, amt, party:'تحويل وارد', note:t.note||''}); }
    }
    if(t.isJournal && Array.isArray(t.lines)){
      t.lines.forEach(ln=>{
        if(ln.targetType==='box' && ln.targetId===b.id){
          if(num(ln.debit)>0){ const amt=r2(num(ln.debit)); totalIn=r2(totalIn+amt); inList.push({id:t.id, ts:t.ts, amt, party, note:ln.note||t.note||''}); }
          if(num(ln.credit)>0){ const amt=r2(num(ln.credit)); totalOut=r2(totalOut+amt); outList.push({id:t.id, ts:t.ts, amt, party, note:ln.note||t.note||''}); }
        }
      });
    }
  });

  if(Array.isArray(db.expenses)){
    db.expenses.forEach(ex=>{
      if(!inDateRange(ex.date, fromD, toD)) return;
      if(ex.box === b.id && num(ex.amount)>0){
        const amt = r2(num(ex.amount));
        totalOut = r2(totalOut + amt);
        outList.push({id:'', isExp:true, ts:(ex.date||todayStr())+'T00:00', amt, party:'مصروف: '+ex.title, note:ex.cat||''});
      }
    });
  }
  if(Array.isArray(db.otherRevenues)){
    db.otherRevenues.forEach(rv=>{
      if(!inDateRange(rv.date, fromD, toD)) return;
      if(rv.box === b.id && num(rv.amount)>0){
        const amt = r2(num(rv.amount));
        totalIn = r2(totalIn + amt);
        inList.push({id:'', isRev:true, ts:(rv.date||todayStr())+'T00:00', amt, party:'إيراد إضافي: '+rv.title, note:rv.cat||''});
      }
    });
  }
  if(Array.isArray(db.assets)){
    db.assets.forEach(as=>{
      if(!inDateRange(as.date, fromD, toD)) return;
      if(as.fundSource === 'box' && as.box === b.id && num(as.cost)>0){
        const amt = r2(num(as.cost));
        totalOut = r2(totalOut + amt);
        outList.push({id:'', isAsset:true, ts:(as.date||todayStr())+'T00:00', amt, party:'شراء أصل: '+as.name, note:as.cat||''});
      }
    });
  }

  inList.sort((a,b)=>a.ts<b.ts?1:-1);
  outList.sort((a,b)=>a.ts<b.ts?1:-1);
  const periodNet = r2(totalIn - totalOut);
  return { box:b, inList, outList, totalIn, totalOut, openBal:r2(num(b.open)), netBal:(fromD||toD)?periodNet:boxBal(b) };
}

function txMenu(id){
  const t=db.tx.find(x=>x.id===id); if(!t) return;
  const canEdit = canEditOrDeleteOnDate(t.ts);
  const editFn = t.isFx ? `openExchangeModal('${id}')` :
                 t.isJournal ? `editJournalFromTx('${id}')` :
                 t.isTransfer ? `openTransfer('${id}')` :
                 t.isSham ? `openShamTx('${id}')` :
                 t.isUsdt ? `openUsdtTx('${id}')` :
                 `openTx('${id}')`;

  const lockReason = !isManager() ? 'وضع الموظف لا يسمح بتعديل أو حذف العمليات السابقة.' : 'هذا التاريخ مقفل — افتح قفل اليوم أولاً للتعديل أو الحذف.';

  showSheet(`<h3>تفاصيل العملية</h3>${txRow(t)}
    <button class="btn whatsapp full" onclick="openOfficialReceipt('${id}')">🧾 إصدار إيصال رسمي للزبون (واتساب / طباعة)</button>
    ${canEdit ? `${t.isAdjust?'':`<button class="btn full" onclick="${editFn}">تعديل العملية</button>`}
    <button class="btn danger full" onclick="askDelTx('${id}')">حذف العملية</button>` :
    `<p class="sub" style="margin-top:10px;color:var(--warn)">🔒 ${lockReason}</p>`}
    <button class="btn ghost full" onclick="closeSheet()">إغلاق</button>`);
}

                  t.isUsdt ? (t.type==='in'?'استلام USDT':'تسليم USDT') :

                  (t.type==='in'?'إيصال قبض':'إيصال دفع');

  window._lastReceiptWa = {

          `🔢 رقم المرجع: ${t.voucherNo || t.id.slice(-5).toUpperCase()}\n` +
          `📅 التاريخ: ${t.ts.replace('T',' ')}\n` +
          (c ? `👤 الزبون: *${c.name}*\n` : '') +
          `💰 المبلغ: *${fmt(t.amount)} ${symOf(t.cur||BASE)}*\n` +

function setDayLock(d, locked){
  if(!isManager()) return;
  if(locked && d === todayStr()){
    const allOk = db.cashboxes.every(b => dayBoxStatus(b, d).ok);
    if(!allOk){ openCloseDay(d); return; }
  }
  if(!db.lockMeta || typeof db.lockMeta !== 'object') db.lockMeta = {};
  db.lockMeta[d] = { l: !!locked, _u: Date.now() };
  db.lockedDates = Object.keys(db.lockMeta).filter(x => db.lockMeta[x] && db.lockMeta[x].l).sort();
  save(); closeSheet(); render();
}
function toggleDayLock(d){
  if(!isManager()) return;
  if(isDateLocked(d)) setDayLock(d, false);
  else openCloseDay(d);
}

function downloadBackupFile(){
  db.settings.lastBackupDate = todayStr();

  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});

  const a = document.createElement('a');
  a.href = url;
  a.download = `mustafa-tech-backup-${todayStr()}.json`;

  URL.revokeObjectURL(url);

function openStmt(id){ ui.stmtId=id; ui.stmtCur=''; ui.stmtDir=''; render(); window.scrollTo(0,0); }

function vStmt(){
  const c=db.customers.find(x=>x.id===ui.stmtId);
  if(!c){ui.stmtId=null;return vCust();}
  const list=db.tx.filter(t=> (t.cust===c.id && !t.isTransfer) || (t.isJournal && Array.isArray(t.lines) && t.lines.some(l=>l.targetType==='cust'&&l.targetId===c.id)) ).sort((a,b)=>a.ts<b.ts?-1:1);
  const run={}, totInByCur={}, totOutByCur={};

  let rows=list.map(t=>{
    if(t.isJournal){
      let jCur = t.cur || BASE;
      let jNet = 0;
      t.lines.filter(l=>l.targetType==='cust'&&l.targetId===c.id).forEach(l=>{
        jCur = l.cur || t.cur || BASE;
        const cr = num(l.credit), dbAmt = num(l.debit);
        totInByCur[jCur] = r2((totInByCur[jCur]||0) + cr);
        totOutByCur[jCur] = r2((totOutByCur[jCur]||0) + dbAmt);
        const delta = cr - dbAmt;
        jNet += delta;
        run[jCur] = r2((run[jCur]||0) + delta);
      });
      return {t, effCur:jCur, effAmt:Math.abs(jNet), effIn:jNet>=0, bal:run[jCur]||0};
    }

    if(t.postAsUsd && num(t.usdBookAmt) !== 0){
      const uAmt = Math.abs(num(t.usdBookAmt));
      const isIn = t.type === 'in';
      if(isIn) totInByCur['USD'] = r2((totInByCur['USD']||0) + uAmt);
      else totOutByCur['USD'] = r2((totOutByCur['USD']||0) + uAmt);
      run['USD'] = r2((run['USD']||0) + (isIn ? uAmt : -uAmt));
      return {t, effCur:'USD', effAmt:uAmt, effIn:isIn, bal:run['USD']||0};
    }

    if(!((t.isUsdt || t.isSham || t.isFx) && t.settledFull)){
      if(t.isUsdt && t.settleCur === 'USD'){
        const signedRem = r2(num(t.remUsd));
        if(Math.abs(signedRem) > 0.004){
          if(signedRem > 0) totInByCur['USD'] = r2((totInByCur['USD']||0) + signedRem);
          else totOutByCur['USD'] = r2((totOutByCur['USD']||0) + Math.abs(signedRem));
          run['USD'] = r2((run['USD']||0) + signedRem);
        }
        return {t, effCur:'USD', effAmt:Math.abs(signedRem), effIn:signedRem>=0, bal:run['USD']||0};
      }
      if((t.isSham || t.isFx) && !t.settledFull && num(t.remAmt) !== 0){
        const rCur = t.remCur || t.cur;
        const sRem = r2(num(t.remAmt));
        if(sRem > 0) totInByCur[rCur] = r2((totInByCur[rCur]||0) + sRem);
        else totOutByCur[rCur] = r2((totOutByCur[rCur]||0) + Math.abs(sRem));
        run[rCur] = r2((run[rCur]||0) + sRem);
        return {t, effCur:rCur, effAmt:Math.abs(sRem), effIn:sRem>=0, bal:run[rCur]||0};
      }
      if(t.type==='in') totInByCur[t.cur] = r2((totInByCur[t.cur]||0) + num(t.amount));
      else totOutByCur[t.cur] = r2((totOutByCur[t.cur]||0) + num(t.amount));
      run[t.cur]=r2((run[t.cur]||0)+(t.type==='in'?t.amount:-t.amount));
    }
    return {t, effCur:t.cur, effAmt:t.amount, effIn:t.type==='in', bal:run[t.cur]||0};
  });

  const curs=Array.from(new Set([...Object.keys(run), ...Object.keys(totInByCur), ...Object.keys(totOutByCur)]));
  if(ui.stmtCur) rows=rows.filter(r=>r.effCur===ui.stmtCur);
  if(ui.stmtDir==='in') rows=rows.filter(r=>r.effIn);
  if(ui.stmtDir==='out') rows=rows.filter(r=>!r.effIn);
  if(ui.stmtFrom || ui.stmtTo) rows=rows.filter(r=>inDateRange(r.t.ts, ui.stmtFrom, ui.stmtTo));

  let waText = `📄 *كشف حساب تفصيلي: ${c.name}* - ${db.settings.officeName}\nالهاتف: ${c.phone||'-'}\nالتاريخ: ${todayStr()}\n\n`;
  rows.forEach(({t,effCur,effAmt,effIn,bal})=>{
    waText += `${t.ts.slice(0,10)} | ${effIn?'قبض/له':'تسليم/عليه'}: ${fmt(effAmt)} ${symOf(effCur)} (الرصيد: ${fmt(Math.abs(bal))} ${balWord(bal)})\n`;
  });
  window._lastStmtWa = { phone: c.phone||'', text: waText };

  let h=`<div class="top noprint"><button class="chip" onclick="ui.stmtId=null;render()">⬅️ رجوع لفهرس الزبائن</button>
    ${isManager()?`<button class="chip" onclick="openCust('${c.id}')">⚙️ تعديل الزبون / سقف الدين</button>`:''}</div>
    <h2 style="margin-top:12px">📊 كشف حساب الزبون: ${esc(c.name)}</h2>
    <div class="sub">${esc(c.phone||'')} ${num(c.creditLimit)>0?` | سقف الدين: $${fmt(c.creditLimit)}`:''} ${c.notes?' | ملاحظة: '+esc(c.notes):''}</div>
    <div class="balbar">${balPills(run)}</div>

    <div class="card noprint" style="padding:10px;margin-top:8px">
      <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end">
        <div><label style="margin:0 0 2px;font-size:12px">من تاريخ</label><input type="date" value="${esc(ui.stmtFrom)}" onchange="ui.stmtFrom=this.value;render()"></div>

      <div class="st-line"><b class="${effIn?'pos':'neg'} priv">${effIn?'+':'−'}${fmt(effAmt)} ${esc(symOf(effCur))}</b>
      <span class="priv">${(t.isUsdt||t.isSham||t.isFx)&&t.settledFull?'<small>مسددة فوراً</small>':`الرصيد: <b class="${balCls(bal)}">${fmt(Math.abs(bal))} ${esc(symOf(effCur))}</b> <small>${balWord(bal)}</small>`}</span></div>
      ${t.postAsUsd && num(t.usdBookAmt)>0?`<div class="sub" style="color:var(--accent-2)">أصل الحركة: ${fmt(t.amount)} ${esc(symOf(t.cur))} ÷ ${fmt(t.bookFxRate)} = $${fmt(t.usdBookAmt)}</div>`:''}
      ${diff?`<div class="sub">${effIn?'قُبض':'دُفع'} ${fmt(t.settleAmt)} ${esc(symOf(t.settle))} بسعر ${fmt(t.rate,8)}</div>`:''}

      ${t.note?`<div class="sub">${esc(t.note)}</div>`:''}</div>`}).join(''):'<div class="empty">لا توجد عمليات مطابقة</div>';
  return h;
}

  if(id){

  markDeleted(id); db.customers=db.customers.filter(c=>c.id!==id); ui.stmtId=null; save(); closeSheet(); render();

function openTransfer(id){
  ensureDefaults();
  const t = id ? db.tx.find(x=>x.id===id) : null;
  TR = t ? {...t} : {id:null, isTransfer:true, ts:nowLocal(), fromBox:db.cashboxes[0]?.id||'', toBox:db.cashboxes[1]?.id||'', amount:'', settleAmt:'', note:''};
