    <select id="trFrom" onchange="syncTransferBoxes()">${db.cashboxes.map(b=>`<option value="${b.id}" ${b.id===TR.fromBox?'selected':''}>${esc(b.name)} (${esc(symOf(b.cur))})</option>`).join('')}</select>
    <label>إلى صندوق (المستلم)</label>
    <select id="trTo" onchange="syncTransferBoxes()">${db.cashboxes.map(b=>`<option value="${b.id}" ${b.id===TR.toBox?'selected':''}>${esc(b.name)} (${esc(symOf(b.cur))})</option>`).join('')}</select>
    <label id="trAmtLbl">المبلغ المسحوب من المصدر</label>
    <input id="trAmt" inputmode="decimal" value="${TR.amount}" placeholder="0">
    <div id="trDestWrap" style="display:none">
      <label id="trDestLbl">المبلغ المودع في الصندوق المستلم</label>
      <input id="trSettleAmt" inputmode="decimal" value="${TR.settleAmt||TR.amount}" placeholder="0">
    </div>
    <label>التاريخ والوقت</label>
    <input type="datetime-local" id="trTs" value="${TR.ts}">
    <label>ملاحظات</label>
    <textarea id="trNote">${esc(TR.note||'')}</textarea>
    <div class="err" id="trErr"></div>
    <button class="btn full" onclick="saveTransfer()">حفظ التحويل</button>`);
  syncTransferBoxes();
}

function syncTransferBoxes(){
  const fb = db.cashboxes.find(b=>b.id===$('#trFrom')?.value);
  const tb = db.cashboxes.find(b=>b.id===$('#trTo')?.value);
  if(!fb || !tb) return;
  $('#trAmtLbl').textContent = `المبلغ المسحوب من ${fb.name} (${symOf(fb.cur)})`;
  const wrap = $('#trDestWrap');
  if(fb.cur !== tb.cur){
    wrap.style.display = 'block';
    $('#trDestLbl').textContent = `المبلغ المودع في ${tb.name} (${symOf(tb.cur)})`;
  } else wrap.style.display = 'none';
}

function saveTransfer(){
  const err=m=>{const e=$('#trErr');e.textContent=m;e.style.display='block';};
  const tsVal = $('#trTs').value || nowLocal();
  if(!canAddOnDate(tsVal)) return err('هذا التاريخ مقفل من قِبل المدير.');
  const amt=num($('#trAmt').value);
  if(amt<=0) return err('اكتب المبلغ المحول');
  const fromBox=$('#trFrom').value, toBox=$('#trTo').value;
  if(fromBox===toBox) return err('لا يمكن التحويل لنفس الصندوق');
  const fb = db.cashboxes.find(b=>b.id===fromBox);
  const tb = db.cashboxes.find(b=>b.id===toBox);
  const diffCur = fb && tb && fb.cur !== tb.cur;
  const destAmt = diffCur ? num($('#trSettleAmt').value) : amt;
  if(diffCur && destAmt<=0) return err('اكتب المبلغ المودع في الصندوق المستلم');

  const rec={
    id:TR.id||uid(), isTransfer:true, fromBox, toBox,
    cur: fb ? fb.cur : BASE, amount:r2(amt), settleAmt:r2(destAmt),
    ts:tsVal, note:$('#trNote').value.trim(), _u:Date.now()
  };
  if(TR.id){const i=db.tx.findIndex(t=>t.id===TR.id); db.tx[i]=rec;}
  else db.tx.push(rec);
  save(); closeSheet(); render();
}

/* =====================================================================
   نموذج عملية USDT المطور:
   - إصلاح خطأ 500 USDT مقابل 600$ (ينزل عليه دين تلقائياً)
   - مقترح الباقي بالليرة السورية وتقسيمه بين كاش سوري وشام كاش سوري
   - إضافة الربح (1% أو النسبة المحددة) تلقائياً
   - حماية الخطأ (>1%) ومنع الحفظ إذا كانت مسددة بالكامل
   ===================================================================== */
let U={};
const SPLIT_METHODS=[
  {key:'sham_syp', box:'b_sham_syp', label:'شام كاش (سوري)', cur:'SYP'},
  {key:'sham_usd', box:'b_sham_usd', label:'شام كاش ($)', cur:'USD'},
  {key:'cash_usd', box:'b2',         label:'دولار كاش ($)', cur:'USD'},
  {key:'cash_syp', box:'b1',         label:'سوري كاش (ل.س)', cur:'SYP'}
];

function calcUsdtSettlementUsd(){
  const a = num(U.amount);
  const pct = num(U.feePct !== undefined ? U.feePct : 1);
  if(a <= 0) return { settleUsd: 0, feeUsd: 0, paidUsd: 0, signedRemUsd: 0, remSypNeeded: 0, fxRate: 0 };
  const factor = U.type === 'in' ? (1 - pct / 100) : (1 + pct / 100);
  const settleUsd = r2(a * factor);
  const feeUsd = r2(Math.abs(a - settleUsd));
  const dStr = (U.ts || todayStr()).slice(0, 10);
  const fxRate = num(U.sypRate) || symRate('USD', dStr) || (U.type==='in'?(num(db.settings.fxBuyRate)||149):(num(db.settings.fxSellRate)||150));

  let paidUsd = 0;
  let usdOnlyPaid = 0;
  let sypOnlyPaid = 0;

  SPLIT_METHODS.forEach(m=>{
    const v = num(U.sp[m.key]);
    if(v > 0){
      if(m.cur === 'USD' || m.cur === 'USDT'){
        paidUsd = r2(paidUsd + v);
        usdOnlyPaid = r2(usdOnlyPaid + v);
      } else {
        sypOnlyPaid = r2(sypOnlyPaid + v);
        paidUsd = r2(paidUsd + (fxRate > 0 ? v / fxRate : toUSD(v, m.cur, dStr)));
      }
    }
  });

  // الإشارة الدقيقة لذمة الزبون:
  // في الشراء (in): الزبون يستحق settleUsd، استلم paidUsd => الباقي = settleUsd - paidUsd (إذا استلم أكثر يطلع سالب = عليه دين!)
  // في البيع (out): الزبون عليه settleUsd، دفع paidUsd => الباقي = paidUsd - settleUsd (إذا دفع أقل يطلع سالب = عليه دين!)
  const signedRemUsd = U.settledFull ? 0 : (U.type === 'in' ? r2(settleUsd - paidUsd) : r2(paidUsd - settleUsd));

  // حساب الباقي المطلوب بالليرة السورية بعد خصم الدولار المدفوع وما تم إدخاله مسبقاً من الليرة
  const remUsdForSyp = Math.max(0, r2(settleUsd - usdOnlyPaid));
  const totalSypEquivalent = fxRate > 0 ? r2(remUsdForSyp * fxRate) : 0;
  const remSypNeeded = Math.max(0, r2(totalSypEquivalent - sypOnlyPaid));

  return { settleUsd, feeUsd, paidUsd, signedRemUsd, remSypNeeded, totalSypEquivalent, fxRate };
}

function openUsdtTx(id, preCust){
  ensureDefaults();
  const t = id ? db.tx.find(x=>x.id===id) : null;
  const usdtBox = db.cashboxes.find(b=>b.cur==='USDT') || {id:'b_usdt'};
  const defRate = symRate('USD', todayStr()) || num(db.settings.fxBuyRate) || 149;
  if(t){
    const spMap={sham_syp:'',sham_usd:'',cash_usd:'',cash_syp:''};
    if(Array.isArray(t.splits)){
      t.splits.forEach(s=>{
        const m=SPLIT_METHODS.find(x=>x.box===s.box);
        if(m) spMap[m.key]=s.amount;
      });
    }
    U={
      id:t.id, type:t.type, cust:t.cust||'', ts:t.ts, amount:t.amount,
      feePct: t.feePct !== undefined ? t.feePct : 1,
      sypRate: t.sypRate || defRate,
      box:t.box||usdtBox.id, note:t.note||'', settledFull:t.settledFull!==false,
      autoProfit: t.autoProfit !== false,
      profit:t.profit||'', profitCur:t.profitCur||'USD', sp:spMap
    };
  } else {
    U={
      id:null, type:'in', cust:preCust||ui.opsCust||'', ts:nowLocal(), amount:'',
      feePct: 1, sypRate: defRate,
      box:usdtBox.id, note:'', settledFull:true, autoProfit:true,
      profit:'', profitCur:'USD',
      sp:{sham_syp:'',sham_usd:'',cash_usd:'',cash_syp:''}
    };
  }
  showSheet(usdtFormHtml());
  syncUsdtForm();
}

  <textarea id="uNote" oninput="U.note=this.value" placeholder="تفاصيل إضافية أو رقم الحوالة...">${esc(U.note||'')}</textarea>
  <div class="err" id="uErr"></div>
  <button id="uSaveBtn" class="btn usdt full" onclick="saveUsdtTx()">حفظ عملية USDT</button>`;
}

function uType(t){
  U.type=t;
  const dStr = (U.ts || todayStr()).slice(0,10);
  U.sypRate = symRate('USD', dStr) || (t==='in'?(num(db.settings.fxBuyRate)||149):(num(db.settings.fxSellRate)||150));
  if($('#uSypRate')) $('#uSypRate').value = U.sypRate;
  syncUsdtForm();
}
function syncUsdtForm(){
  const isIn = U.type==='in';
  $('#uIn').classList.toggle('on',isIn);
  $('#uOut').classList.toggle('on',!isIn);
  $('#uHint').textContent = isIn ? 'استلمت USDT ⬅️ يُخصم % العمولة، والباقي يُسلّم للزبون أو يُقيّد له' : 'سلمت USDT ⬅️ يُضاف % العمولة، ويُستلم المقابل أو يُقيّد عليه دين';
  $('#uSplitTitle').textContent = isIn ? 'كيف سلمت المقابل للزبون؟' : 'كيف استلمت المقابل من الزبون؟';
  syncUsdtSum();
}

function fillUsdtRemainingSyp(targetKey){
  const calc = calcUsdtSettlementUsd();
  if(calc.remSypNeeded <= 0) return;
  const curVal = num(U.sp[targetKey]);
  U.sp[targetKey] = r2(curVal + calc.remSypNeeded);
  const el = $(`#sp_${targetKey}`);
  if(el) el.value = U.sp[targetKey];
  syncUsdtSum();
}

function syncUsdtSum(){
  const el=$('#uSum'); if(!el) return;
  const a=num(U.amount);
  const calc = calcUsdtSettlementUsd();
  const prevEl = $('#uSettlePreview');
  if(prevEl) prevEl.textContent = `${fmt(calc.settleUsd)} $ (عمولة: ${fmt(calc.feeUsd)} $)`;

  // تحديث الربح التلقائي (الافتراضي ينضاف إلا إذا ألغاه المدير)
  if(U.autoProfit){
    U.profit = calc.feeUsd > 0 ? calc.feeUsd : '';
    if($('#uProfit')) $('#uProfit').value = U.profit;
  }

  // عرض مقترح الباقي بالليرة السورية مع أزرار تعبئة سريعة (كاش سوري أو شام كاش سوري)
  const sugBox = $('#uSypSuggestBox');
  if(sugBox){
    if(a > 0 && calc.remSypNeeded > 1){
      sugBox.innerHTML = `<div class="suggest-box">
        <div>💡 المتبقي بالليرة السورية: <b style="color:var(--accent-2);font-size:15px">${fmt(calc.remSypNeeded)} ل.س</b></div>
        <div style="display:flex;gap:5px">
          <button type="button" class="chip" style="background:var(--in-bg);color:var(--in);border-color:var(--in);padding:4px 9px;font-size:12px" onclick="fillUsdtRemainingSyp('cash_syp')">+ سوري كاش</button>
          <button type="button" class="chip" style="background:var(--sham-bg);color:var(--sham);border-color:var(--sham);padding:4px 9px;font-size:12px" onclick="fillUsdtRemainingSyp('sham_syp')">+ شام كاش سوري</button>
        </div>
      </div>`;
    } else {
      sugBox.innerHTML = '';
    }
  }

  const parts=[];
  SPLIT_METHODS.forEach(m=>{
    const v=num(U.sp[m.key]);
    if(v>0) parts.push(`${fmt(v)} ${symOf(m.cur)} (${m.label})`);
  });
  if(!a && !parts.length){ el.textContent=''; }
  else {
    el.textContent = `${fmt(a)} USDT (صافي التسوية: ${fmt(calc.settleUsd)} $)` + (parts.length ? ` ⬅️ ${parts.join(' + ')}` : '');
  }

  // عرض الذمة المتبقية بإشارتها الصحيحة (تصحيح خطأ الـ 500 USDT مقابل 600$)
  const debtEl = $('#uDebtPreview');
  if(debtEl){
    if(U.settledFull){
      debtEl.style.color = 'var(--in)';
      debtEl.textContent = '✅ مسددة بالكامل (لا يُسجَّل دين على الزبون)';
    } else if(Math.abs(calc.signedRemUsd) > 0.004){
      const isCreditToHim = calc.signedRemUsd > 0;
      debtEl.style.color = isCreditToHim ? 'var(--in)' : 'var(--out)';
      const side = isCreditToHim ? 'له عندنا (دائن علينا بـ USD)' : 'عليه لنا (دين عليه بـ USD)';
      debtEl.textContent = `📌 الباقي بذمة الزبون بـ USD: ${fmt(Math.abs(calc.signedRemUsd))} $ — ${side}`;
    } else {
      debtEl.style.color = 'var(--muted)';
      debtEl.textContent = 'متوازن (0.00 $)';
    }
  }

  // حماية الخطأ (> 1%): إذا كانت مسددة بالكامل والفرق بين التسوية والمدفوع أكبر من 1% يمنع الحفظ
  const guardEl = $('#uGuardAlert');
  const saveBtn = $('#uSaveBtn');
  const diffUsd = Math.abs(r2(calc.settleUsd - calc.paidUsd));
  const diffPct = calc.settleUsd > 0 ? (diffUsd / calc.settleUsd) * 100 : 0;
  if(guardEl && saveBtn){
    if(U.settledFull && a > 0 && diffPct > 1.01){
      guardEl.innerHTML = `<div class="warn-box" style="background:var(--out-bg);color:var(--out);border-color:var(--out)">
        ⛔ خطأ في المبالغ (فرق ${diffPct.toFixed(1)}% أكبر من 1%): المطلوب تسويته <b>$${fmt(calc.settleUsd)}</b> والمدخل بالمقابل <b>$${fmt(calc.paidUsd)}</b> (فرق <b>$${fmt(diffUsd)}</b>). عدّل المبلغ أو ألغِ خيار "مسددة بالكامل" لتسجيل الفرق كدين على الزبون!
      </div>`;
      saveBtn.disabled = true;
      saveBtn.style.opacity = '0.5';
    } else {
      guardEl.innerHTML = '';
      saveBtn.disabled = false;
      saveBtn.style.opacity = '1';
    }
  }
}

function saveUsdtTx(){
  const err=m=>{const e=$('#uErr');e.textContent=m;e.style.display='block';};
  if(!canAddOnDate(U.ts)) return err('هذا التاريخ مقفل من قِبل المدير.');
  const a=num(U.amount);
  if(a<=0) return err('اكتب مبلغ الـ USDT');
  const calc = calcUsdtSettlementUsd();
  if(!U.settledFull && Math.abs(calc.signedRemUsd) > 0.004 && !U.cust){
    return err('اختر الزبون لتسجيل باقي الحساب كدين/رصيد بعملة USD');
  }
  const oppDir = U.type==='in' ? 'out' : 'in';
  const splits=[];
  SPLIT_METHODS.forEach(m=>{
    const v=r2(num(U.sp[m.key]));
    if(v>0){
      splits.push({box:m.box, cur:m.cur, label:m.label, amount:v, dir:oppDir});
    }
  });
  const pct = num(U.feePct !== undefined ? U.feePct : 1);
  const rec={
    id:U.id||uid(), isUsdt:true, type:U.type, cust:U.cust||'', ts:U.ts||nowLocal(),
    amount:r2(a), cur:'USDT', settle:'USDT', rate:1, settleAmt:r2(a),
    feePct: pct, sypRate: calc.fxRate, settleUsd: calc.settleUsd, paidUsd: calc.paidUsd,
    remUsd: U.settledFull ? 0 : calc.signedRemUsd,
    settleCur: 'USD',
    box:U.box||'b_usdt', splits, settledFull:U.settledFull,
    autoProfit: U.autoProfit,
    profit:isManager() ? r2(num(U.profit)) : 0,
    profitCur:U.profitCur||'USD', note:(U.note||'').trim(), _u:Date.now()
  };
  if(U.id){const i=db.tx.findIndex(t=>t.id===U.id);db.tx[i]=rec;}
  else db.tx.push(rec);
  save(); closeSheet(); render();
}

}

function recomputeUsdBook(){
  const a = num(F.amount);
  const r = num(F.bookFxRate);
  if(a > 0 && r > 0){
    F.usdBookAmt = r2(a / r);
    if($('#fUsdBookAmt')) $('#fUsdBookAmt').value = F.usdBookAmt;
  }
}

function checkCustCreditAlert(){
  const box = $('#creditAlertBox');
  if(!box) return;
  if(!F.cust){ box.innerHTML=''; return; }
  const c = db.customers.find(x=>x.id===F.cust);
  if(!c || num(c.creditLimit)<=0){ box.innerHTML=''; return; }
  const debtUsd = custDebtInUSD(c.id);
  if(debtUsd >= num(c.creditLimit)){
    box.innerHTML = `<div class="warn-box">🚨 تنبيه سقف الدين: إجمالي رصيد الزبون المدين الحالي ($${fmt(debtUsd)}) بلغ أو تجاوز السقف المسموح ($${fmt(c.creditLimit)})!</div>`;
  } else box.innerHTML = '';
}

function fPay(m){
  F.payMethod=m;
  $('#pCash').classList.toggle('on', m==='cash');
  $('#pCredit').classList.toggle('on', m==='credit');
  $('#boxSection').style.display = m==='credit' ? 'none' : 'block';
  if(m==='credit') F.box = '';
  checkCustCreditAlert();
}

function syncForm(){
  $('#tIn').classList.toggle('on',F.type==='in'); 
  $('#tOut').classList.toggle('on',F.type==='out');
  $('#pCash').classList.toggle('on',F.payMethod==='cash');
  $('#pCredit').classList.toggle('on',F.payMethod==='credit');
  $('#boxSection').style.display = F.payMethod==='credit' ? 'none' : 'block';

  // إظهار خيار الترحيل بالدولار إذا كانت العملة غير الدولار وهناك زبون محدد
  const postWrap = $('#postAsUsdWrap');
  if(postWrap){
    if(F.cur !== 'USD' && F.cur !== 'USDT' && F.cust){
      postWrap.style.display = 'block';
      if(!F.bookFxRate){
        F.bookFxRate = symRate('USD', (F.ts||todayStr()).slice(0,10)) || num(db.settings.fxSellRate) || 150;
        if($('#fBookFx')) $('#fBookFx').value = F.bookFxRate;
      }
      $('#postAsUsdDetails').style.display = F.postAsUsd ? 'block' : 'none';
      if(F.postAsUsd) recomputeUsdBook();
    } else {
      postWrap.style.display = 'none';
      F.postAsUsd = false;
    }
  }

  const isIn=F.type==='in', diff=F.cur!==F.settle;
  $('#lSet').textContent=isIn?'العملة المقبوضة فعلياً':'العملة المدفوعة فعلياً';
  $('#fxBox').style.display=diff?'block':'none';
  if(diff){
    $('#lRate').textContent=`سعر الصرف: 1 ${F.cur} = كم ${F.settle}`;
    $('#lSetAmt').textContent=(isIn?'المبلغ المقبوض فعلياً بالـ ':'المبلغ المدفوع فعلياً بالـ ')+F.settle;
    $('#fRate').value=F.rate===''?'':F.rate;
    $('#fSetAmt').value=F.settleAmt===''?'':F.settleAmt;
  }
  const boxes=db.cashboxes.filter(b=>b.cur===F.settle);
  $('#fBox').innerHTML='<option value="">بدون صندوق</option>'+boxes.map(b=>`<option value="${b.id}" ${b.id===F.box?'selected':''}>${esc(b.name)}</option>`).join('');
  checkCustCreditAlert();
  sum();
}
function sum(){
  const el=$('#fSum'); if(!el) return;
  const a=num(F.amount);
  if(F.cur!==F.settle){
    el.textContent=(a&&num(F.settleAmt))?`${fmt(a)} ${symOf(F.cur)} = ${fmt(num(F.settleAmt))} ${symOf(F.settle)}`:'';
  } else el.textContent='';
}
function recompute(){
  const a=num(F.amount);
  if(F.cur===F.settle){F.settleAmt=a||'';return;}
  const r=num(F.rate); F.settleAmt=(a&&r)?r2(a*r):'';
}
function fType(t){F.type=t;syncForm();}
function fTs(v){
  F.ts=v||nowLocal();
  if(F.cur!==F.settle&&!F.manual){F.rate=prec(cross(F.cur,F.settle,F.ts.slice(0,10)))||'';recompute();syncForm();}
}
function fAmt(v){
  F.amount=v; recompute();
  if(F.cur!==F.settle) $('#fSetAmt').value=F.settleAmt===''?'':F.settleAmt;
  if(F.postAsUsd) recomputeUsdBook();
  sum();
}
function fRate(v){F.rate=v;F.manual=true;recompute();$('#fSetAmt').value=F.settleAmt===''?'':F.settleAmt;sum();}
function fSetAmt(v){
  F.settleAmt=v;F.manual=true;
  const a=num(F.amount),s=num(v);
  if(a&&s){F.rate=prec(s/a);$('#fRate').value=F.rate;}
  sum();
}
function reprice(){
  F.manual=false;
  F.rate=F.cur===F.settle?1:(prec(cross(F.cur,F.settle,F.ts.slice(0,10)))||'');
  recompute(); autoBox(); syncForm();
}
function fCur(v){F.cur=v;reprice();}
function fSet(v){F.settle=v;reprice();}
function saveTx(){
  const err=m=>{const e=$('#fErr');e.textContent=m;e.style.display='block';};
  if(!canAddOnDate(F.ts)) return err('هذا التاريخ مقفل من قِبل المدير.');
  const a=num(F.amount);
  if(a<=0) return err('اكتب مبلغ العملية');
  const diff=F.cur!==F.settle;
  if(diff && F.payMethod!=='credit' && (num(F.rate)<=0||num(F.settleAmt)<=0)) return err('اكتب سعر الصرف أو المبلغ الفعلي');
  if(F.postAsUsd && num(F.usdBookAmt)<=0) return err('حدد سعر الصرف والقيمة بالدولار لترحيلها لدفتر الزبون');

  const rec={
    id:F.id||uid(), type:F.type, payMethod: F.payMethod||'cash',
    cust:F.cust||'', ts:F.ts, amount:r2(a), cur:F.cur,
    settle:F.settle, rate:diff?num(F.rate):1, settleAmt:diff?r2(num(F.settleAmt)):r2(a),
    box:F.payMethod==='credit'?'':(F.box||''),
    postAsUsd: !!F.postAsUsd,
    bookFxRate: F.postAsUsd ? num(F.bookFxRate) : 0,
    usdBookAmt: F.postAsUsd ? r2(num(F.usdBookAmt)) : 0,
    profit:isManager()?r2(num(F.profit)):0, profitCur:F.profitCur||'SYP', note:(F.note||'').trim(), _u:Date.now()
  };
  if(F.id){const i=db.tx.findIndex(t=>t.id===F.id);db.tx[i]=rec;} else db.tx.push(rec);
  save(); closeSheet(); render();
}

/* =====================================================================
   حزمة التدقيق: جرد الصناديق، العمليات المعلقة، التدقيق العكسي، المطابقة قبل القفل
   ===================================================================== */
const DEFAULT_DENOMS = { USD:[100,50,20,10,5,2,1], SYP:[10000,5000,2000,1000,500,200,100,50] };
let ST = null, stReturn = '';

function boxDenoms(b){
  if(!b) return [];
  if(Array.isArray(b.denoms) && b.denoms.length) return b.denoms.map(Number).filter(x => x > 0);
  if(b.id === 'b_usdt' || String(b.id).indexOf('b_sham') === 0 || b.cur === 'USDT') return [];
  return DEFAULT_DENOMS[b.cur] || [];
}
function stCounted(){
  const b = db.cashboxes.find(x => x.id === ST.box); if(!b) return 0;
  const dn = boxDenoms(b);
  if(dn.length){
    let t = 0;
    dn.forEach(d => { t += d * Math.max(0, Math.round(num(ST.counts[d]))); });
    return r2(t);
  }
  return r2(num(ST.direct));
}
function diffBlockHtml(counted, book, cur){
  const diff = r2(counted - book);
  const usd = toUSD(Math.abs(diff), cur, todayStr());
  const cls = Math.abs(diff) < 0.005 ? 'pos' : 'neg';
  const word = Math.abs(diff) < 0.005 ? '✅ مطابق' : (diff > 0 ? '⬆️ زيادة في الدرج' : '⬇️ عجز في الدرج');
  return `<div class="grid" style="grid-template-columns:1fr 1fr;text-align:center">
    <div class="box"><div class="nm">الفعلي (عدّ الدرج)</div><div class="bal">${fmt(counted)} ${esc(symOf(cur))}</div></div>
    <div class="box"><div class="nm">الدفتري</div><div class="bal">${fmt(book)} ${esc(symOf(cur))}</div></div>
  </div>
  <div class="card" style="margin-top:8px;text-align:center"><b>${word}</b>
    <div class="bal ${cls}" style="font-size:22px">${diff>0?'+':''}${fmt(diff)} ${esc(symOf(cur))}</div>
    ${Math.abs(diff)>=0.005 && cur!=='USD' && cur!=='USDT' && usd>0 ? `<div class="sub">≈ $${fmt(usd)}</div>`:''}</div>`;
}
function openStocktake(boxId, returnDate){
  const b = db.cashboxes.find(x => x.id === boxId) || db.cashboxes[0];
  if(!b){ showSheet('<h3>لا توجد صناديق</h3><button class="btn full" onclick="closeSheet()">حسناً</button>'); return; }
  ST = { box: b.id, counts: {}, direct: '', touched: false };
  stReturn = returnDate || '';
  renderStocktake();
}
function renderStocktake(){
  const b = db.cashboxes.find(x => x.id === ST.box); if(!b) return;
  const dn = boxDenoms(b);
  const fields = dn.length
    ? dn.map(d => `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="min-width:64px;font-weight:700">${fmt(d)}</span><span>×</span><input id="dn_${d}" inputmode="numeric" placeholder="0" value="${esc(ST.counts[d]||'')}" oninput="stSet('${d}',this.value)" style="flex:1"><span class="sub" id="dnt_${d}" style="min-width:84px;text-align:left"></span></div>`).join('')
    : `<label>المبلغ الفعلي الموجود (${esc(symOf(b.cur))})</label><input id="stDirect" inputmode="decimal" value="${esc(ST.direct)}" oninput="ST.direct=this.value;ST.touched=true;stLive()">`;
  showSheet(`<h3>🧮 جرد صندوق</h3>
    <select onchange="ST.box=this.value;ST.counts={};ST.direct='';ST.touched=false;renderStocktake()">${db.cashboxes.map(x=>`<option value="${x.id}" ${x.id===ST.box?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <div class="sub" style="margin:6px 0">${dn.length?'اكتب عدد الأوراق من كل فئة:':'هذا الصندوق رقمي، اكتب الرصيد الفعلي.'}</div>
    ${fields}
    ${dn.length && isManager() ? `<details style="margin-top:6px"><summary class="sub">✏️ تعديل الفئات</summary><div style="display:flex;gap:6px;margin-top:6px"><input id="dnEdit" style="direction:ltr" value="${esc(dn.join(','))}"><button class="btn" onclick="stSaveDenoms()">حفظ</button></div></details>`:''}
    <div id="stLive" style="margin-top:10px"></div>
    <div class="err" id="stErr"></div>
    <button class="btn full" onclick="stSave()">حفظ الجرد</button>
    <button class="btn ghost full" onclick="stClose()">إغلاق</button>`);
  stLive();
}
function stSet(d, v){
  ST.counts[d] = v; ST.touched = true;
  const q = Math.max(0, Math.round(num(v)));
  const el = $('#dnt_' + d); if(el) el.textContent = q ? '= ' + fmt(q * Number(d)) : '';
  stLive();
}
function stLive(){
  const b = db.cashboxes.find(x => x.id === ST.box); const el = $('#stLive'); if(!b || !el) return;
  el.innerHTML = diffBlockHtml(stCounted(), boxBal(b), b.cur);
}
function stSaveDenoms(){
  const b = db.cashboxes.find(x => x.id === ST.box); if(!b) return;
  const dnEl = $('#dnEdit'); if(!dnEl) return;
  const arr = String(dnEl.value).split(/[,،\s]+/).map(num).filter(x => x > 0);
  if(!arr.length) return;
  b.denoms = Array.from(new Set(arr)).sort((x,y) => y - x); b._u = Date.now();
  ST.counts = {}; save(); renderStocktake();
}
function stClose(){ if(stReturn){ const d = stReturn; stReturn = ''; openCloseDay(d); } else closeSheet(); }
function stSave(){
  const b = db.cashboxes.find(x => x.id === ST.box); if(!b) return;
  const counted = stCounted();
  if(!ST.touched && counted === 0){ const e = $('#stErr'); e.textContent = 'أدخل الجرد أولاً'; e.style.display = 'block'; return; }
  const book = boxBal(b), diff = r2(counted - book), who = auditWho();
  const rec = { id: uid(), box: b.id, date: todayStr(), ts: nowLocal(), cur: b.cur, counted, book, diff,
    counts: Object.assign({}, ST.counts), by: who.by, role: who.role,
    status: Math.abs(diff) < 0.005 ? 'ok' : 'open', adjTx: '', reason: '', _u: Date.now() };
  db.stocktakes.push(rec);
  save();
  showStocktakeResult(rec.id);
}
function showStocktakeResult(id){
  const st = db.stocktakes.find(x => x.id === id); if(!st) return;
  const b = db.cashboxes.find(x => x.id === st.box);
  const cur = st.cur || (b && b.cur) || BASE;
  let h = `<h3>نتيجة جرد ${esc(b ? b.name : '')}</h3>` + diffBlockHtml(st.counted, st.book, cur);
  if(st.status === 'ok'){
    h += `<div class="sub" style="margin-top:8px">✅ الصندوق مطابق للدفتر.</div>`;
  } else if(st.status === 'adjusted'){
    h += `<div class="sub" style="margin-top:8px">⚖️ تمت التسوية بقيد «فرق جرد».</div>`;
  } else if(st.status === 'accepted'){
    h += `<div class="sub" style="margin-top:8px">📝 فرق مقبول بسبب: <b>${esc(st.reason||'')}</b></div>`;
  } else {
    h += `<button class="btn magic full" style="margin-top:8px" onclick="openDiffFinder('${st.id}')">🔎 ابحث عن سبب الفرق</button>`;
    if(isManager()){
      h += `<button class="btn cap full" onclick="stAdjust('${st.id}')">⚖️ إنشاء قيد تسوية «فرق جرد»</button>
        <label>أو اقبل الفرق مع ذكر السبب</label><input id="stReason" placeholder="مثال: فرق صرافة قديم / خطأ عدّ">
        <div class="err" id="stErr"></div>
        <button class="btn ghost full" onclick="stAccept('${st.id}')">قبول الفرق بدون قيد</button>`;
    } else {
      h += `<div class="sub" style="margin-top:8px">⚠️ يقدر المدير فقط يسوّي الفرق أو يقبله.</div>`;
    }
  }
  h += `<button class="btn ghost full" onclick="stClose()">${stReturn ? 'رجوع لإغلاق اليومية' : 'إغلاق'}</button>`;
  showSheet(h);
}
function stAdjust(id){
  if(!isManager()) return;
  const st = db.stocktakes.find(x => x.id === id); if(!st || st.status !== 'open') return;
  const b = db.cashboxes.find(x => x.id === st.box); if(!b) return;
  if(!canAddOnDate(todayStr())){ const e = $('#stErr'); if(e){ e.textContent = 'اليوم مقفل: افتح القفل أولاً لإنشاء قيد التسوية.'; e.style.display = 'block'; } return; }
  const diff = r2(num(st.counted) - boxBal(b));
  if(Math.abs(diff) < 0.005){ st.status = 'ok'; st._u = Date.now(); save(); showStocktakeResult(id); return; }
  const a = r2(Math.abs(diff));
  const t = { id: uid(), isAdjust: true, type: diff > 0 ? 'in' : 'out', cust: '', ts: nowLocal(),
    amount: a, cur: b.cur, settle: b.cur, rate: 1, settleAmt: a, box: b.id, profit: 0, profitCur: 'SYP',
    note: 'فرق جرد ' + (diff > 0 ? '(زيادة)' : '(عجز)') + ' — جرد ' + st.ts.replace('T', ' '), stRef: st.id, _u: Date.now() };
  db.tx.push(t);
  st.status = 'adjusted'; st.adjTx = t.id; st._u = Date.now();
  save(); render(); showStocktakeResult(id);
}
function stAccept(id){
  if(!isManager()) return;
  const st = db.stocktakes.find(x => x.id === id); if(!st || st.status !== 'open') return;
  const r = String(($('#stReason') || {}).value || '').trim();
  if(r.length < 3){ const e = $('#stErr'); e.textContent = 'اكتب سبب قبول الفرق (3 أحرف على الأقل)'; e.style.display = 'block'; return; }
  st.status = 'accepted'; st.reason = r; st._u = Date.now();
  save(); showStocktakeResult(id);
}
function stocktakeValid(st, b){
  const ref = st.status === 'adjusted' ? num(st.counted) : num(st.book);
  return Math.abs(ref - boxBal(b)) < 0.005;
}

function boxEffects(boxId, date){
  const out = [];
  const inDate = ts => String(ts || '').slice(0, 10) === date;
  db.tx.forEach(t => {
    if(t.payMethod === 'credit' || !inDate(t.ts)) return;
    let e = 0;
    if(t.box === boxId) e += t.type === 'in' ? num(t.settleAmt) : -num(t.settleAmt);
    if(Array.isArray(t.splits)) t.splits.forEach(sp => { if(sp.box === boxId && num(sp.amount) > 0) e += (sp.dir === 'in' ? 1 : -1) * num(sp.amount); });
    if(t.isTransfer){ if(t.fromBox === boxId) e -= num(t.amount); if(t.toBox === boxId) e += num(t.settleAmt || t.amount); }
    if(t.isJournal && Array.isArray(t.lines)) t.lines.forEach(ln => { if(ln.targetType === 'box' && ln.targetId === boxId) e += num(ln.debit) - num(ln.credit); });
    if(Math.abs(e) > 1e-9){
      const c = db.customers.find(x => x.id === t.cust);
      out.push({ id: t.id, kind: 'tx', ts: t.ts, eff: r2(e), label: auditLabel('tx', t) + (c ? ' — ' + c.name : '') });
    }
  });
  (db.expenses || []).forEach(ex => {
    if(ex.box === boxId && num(ex.amount) > 0 && String(ex.date || '').slice(0,10) === date)
      out.push({ id: ex.id, kind: 'exp', ts: (ex.date || date) + 'T23:59', eff: -r2(num(ex.amount)), label: 'مصروف: ' + (ex.title || ex.cat || '') + ' ' + fmt(ex.amount) });
  });
  (db.otherRevenues || []).forEach(rv => {
    if(rv.box === boxId && num(rv.amount) > 0 && String(rv.date || '').slice(0,10) === date)
      out.push({ id: rv.id, kind: 'rev', ts: (rv.date || date) + 'T23:59', eff: r2(num(rv.amount)), label: 'إيراد إضافي: ' + (rv.title || rv.cat || '') + ' ' + fmt(rv.amount) });
  });
  (db.assets || []).forEach(as => {
    if(as.fundSource === 'box' && as.box === boxId && num(as.cost) > 0 && String(as.date || '').slice(0,10) === date)
      out.push({ id: as.id, kind: 'asset', ts: (as.date || date) + 'T23:59', eff: -r2(num(as.cost)), label: 'أصل: ' + (as.name || '') + ' ' + fmt(as.cost) });
  });
  out.sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
  return out;
}

function swapVariants(a){
  const str = String(Math.round(a));
  const res = new Set();
  if(Math.abs(a - Math.round(a)) > 1e-9 || str.length < 2) return [];
  for(let i = 0; i < str.length - 1; i++){
    if(str[i] === str[i+1]) continue;
    const arr = str.split(''); const tmp = arr[i]; arr[i] = arr[i+1]; arr[i+1] = tmp;
    if(arr[0] === '0') continue;
    res.add(Number(arr.join('')));
  }
  return Array.from(res);
}
function findDiffCandidates(ev, D){
  const tol = 0.011, res = [], seen = new Set();
  const add = (m, score, why) => { const k = m.id + '|' + score; if(seen.has(k)) return; seen.add(k); res.push({ m, score, why }); };
  ev.forEach(m => {
    if(Math.abs(m.eff + D) < tol) add(m, 1, 'قيمتها تساوي الفرق تماماً: يحتمل أنها سُجلت ولم تتم فعلياً بالدرج أو تكررت.');
    if(Math.abs(m.eff + D/2) < tol) add(m, 2, 'نصف الفرق: يحتمل أنها سُجلت بالاتجاه المعاكس (قبض بدل دفع أو العكس).');
    const sgn = m.eff >= 0 ? 1 : -1, a = Math.abs(m.eff);
    swapVariants(a).forEach(a2 => { if(Math.abs(sgn * (a2 - a) - D) < tol) add(m, 3, `يحتمل تبديل أرقام: كُتب ${fmt(a)} والصحيح ${fmt(a2)}.`); });
    [a * 10, a / 10].forEach(a2 => { if(a2 > 0 && Math.abs(sgn * (a2 - a) - D) < tol) add(m, 3, `يحتمل صفر زائد/ناقص: كُتب ${fmt(a)} والصحيح ${fmt(a2)}.`); });
  });
  if(!res.length && ev.length <= 150){
    for(let i = 0; i < ev.length; i++) for(let j = i + 1; j < ev.length; j++){
      if(Math.abs(ev[i].eff + ev[j].eff + D) < tol){ add(ev[i], 4, 'مع الحركة التالية مجموعهما يساوي الفرق: ' + ev[j].label); }
    }
  }
  res.sort((x, y) => x.score - y.score);
  return res;
}
let DF = null;
function openDiffFinder(stId){
  const st = stId ? (db.stocktakes || []).find(x => x.id === stId) : null;
  DF = { box: st ? st.box : ((db.cashboxes && db.cashboxes[0]) ? db.cashboxes[0].id : ''), date: st ? st.date : todayStr(), diff: st ? String(st.diff) : '', stId: st ? st.id : '' };
  renderDiffFinder(!!st);
}
function renderDiffFinder(autorun){
  showSheet(`<h3>🔎 التدقيق العكسي للفرق</h3>
    <label>الصندوق</label><select onchange="DF.box=this.value">${db.cashboxes.map(x=>`<option value="${x.id}" ${x.id===DF.box?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <label>اليوم</label><input type="date" value="${esc(DF.date)}" onchange="DF.date=this.value">
    <label>الفارق (سالب للعجز، موجب للزيادة)</label><input inputmode="decimal" style="direction:ltr" value="${esc(DF.diff)}" oninput="DF.diff=this.value">
    <button class="btn magic full" onclick="runDiffFinder()">فحص حركات اليوم</button>
    <div id="dfOut" style="margin-top:8px"></div>
    <button class="btn ghost full" onclick="stClose()">إغلاق</button>`);
  if(autorun) runDiffFinder();
}
function runDiffFinder(){
  const out = $('#dfOut'); if(!out) return;
  const b = db.cashboxes.find(x => x.id === DF.box); if(!b) return;
  const D = r2(num(DF.diff));
  const ev = boxEffects(DF.box, DF.date);
  if(Math.abs(D) < 0.005){ out.innerHTML = '<div class="sub">اكتب رقم الفارق أولاً.</div>'; return; }
  const sym = esc(symOf(b.cur));
  const cands = findDiffCandidates(ev, D);
  const hot = new Set(cands.map(c => c.m.id));
  let h = '';
  if(cands.length){
    h += '<b>الأكثر احتمالاً:</b>' + cands.slice(0, 8).map(c => `<div class="card" style="padding:8px 10px;margin:6px 0;border-color:var(--warn);${c.m.kind==='tx'?'cursor:pointer':''}" ${c.m.kind==='tx'?`onclick="txMenu('${c.m.id}')"`:''}><b>${esc(c.m.label)}</b><div class="sub">${esc(c.m.ts.replace('T',' '))} · ${c.m.eff>0?'+':''}${fmt(c.m.eff)} ${sym}</div><div class="sub" style="color:var(--warn)">${esc(c.why)}</div></div>`).join('');
  } else {
    h += `<div class="warn-box">ما في حركة مسجلة تفسّر الفارق بشكل مباشر. الأقرب: <b>حركة منسية</b> ${D>0?'(قبضت مبلغ ولم تسجله، أو دفعت أقل من المسجل)':'(دفعت مبلغ ولم تسجله، أو قبضت أقل من المسجل)'} بقيمة ${fmt(Math.abs(D))} ${sym}.` + (Math.abs(D) % 9 < 0.011 && Math.abs(D) >= 9 ? ' والفارق يقبل القسمة على 9، فيحتمل تبديل أرقام.' : '') + '</div>';
  }
  h += `<div style="margin-top:8px"><b>كل حركات الصندوق بهذا اليوم (تصاعدياً — ${ev.length}):</b></div><div style="max-height:34vh;overflow:auto">` +
    (ev.length ? ev.slice(0, 80).map(m => `<div class="sub" style="padding:4px 0;border-bottom:1px solid var(--line);${hot.has(m.id)?'color:var(--warn);font-weight:700':''}" ${m.kind==='tx'?`onclick="txMenu('${m.id}')"`:''}>${hot.has(m.id)?'⚠️ ':''}${esc(m.ts.slice(11,16) || '')} · ${m.eff>0?'+':''}${fmt(m.eff)} ${sym} — ${esc(m.label)}</div>`).join('') : '<div class="sub">لا حركات لهذا الصندوق بهذا اليوم.</div>') + '</div>';
  out.innerHTML = h;
}

function pendingItems(){
  const out = [];
  db.tx.forEach(t => {
    if(!t || t.isAdjust || t.isJournal) return;
    const hasSplit = Array.isArray(t.splits) && t.splits.some(sp => num(sp.amount) > 0);
    if(t.isTransfer){
      if(!t.fromBox || !t.toBox || t.fromBox === t.toBox) out.push({ t, why: 'تحويل داخلي ناقص (صندوق غير محدد)' });
      return;
    }
    if(!(num(t.amount) > 0)){ out.push({ t, why: 'مبلغ العملية صفر' }); return; }
    if(t.payMethod === 'credit'){
      if(!t.cust) out.push({ t, why: 'دين بدون تحديد زبون' });
      return;
    }
    if(!t.box && !hasSplit){ out.push({ t, why: 'عملية بدون صندوق (لا تؤثر على أي درج)' }); return; }
    if(!t.isUsdt && !t.isSham && !t.isFx && t.settle && t.settle !== t.cur && !(num(t.rate) > 0)){ out.push({ t, why: 'سعر الصرف ناقص' }); return; }
    if((t.isUsdt || t.isSham || t.isFx) && !t.settledFull && !t.cust) out.push({ t, why: 'غير مسددة بالكامل وبلا زبون' });
  });
  return out;
}
function showPending(){
  const p = pendingItems();
  const rows = p.slice(0, 60).map(x => `<div style="margin:6px 0"><span class="tag out">${esc(x.why)}</span>${txRow(x.t)}</div>`).join('') || '<div class="sub">لا توجد عمليات معلقة ✅</div>';
  showSheet(`<h3>🔔 عمليات تحتاج مراجعة (${p.length})</h3><div style="max-height:62vh;overflow:auto">${rows}</div><button class="btn ghost full" onclick="closeSheet()">إغلاق</button>`);
}

function dayBoxStatus(b, date){
  const moves = boxEffects(b.id, date).length > 0;
  const list = (db.stocktakes || []).filter(x => x.box === b.id && x.date === date).sort((x, y) => (Number(x._u)||0) - (Number(y._u)||0));
  const st = list[list.length - 1];
  if(!st) return moves ? { ok: false, txt: '❌ لم يُجرد بعد' } : { ok: true, txt: '— لا حركات اليوم', optional: true };
  if(!stocktakeValid(st, b)) return { ok: false, txt: '⚠️ تغيّرت الحركات بعد الجرد — أعد الجرد', st };
  if(st.status === 'ok') return { ok: true, txt: '✅ مطابق', st };
  if(st.status === 'adjusted') return { ok: true, txt: '⚖️ سُوّي بقيد جرد', st };
  if(st.status === 'accepted') return { ok: true, txt: '📝 فرق مقبول', st };
  return { ok: false, txt: '⚠️ فرق ' + fmt(st.diff) + ' ' + symOf(b.cur) + ' غير مُسوّى', st };
}
function openCloseDay(d){
  if(!isManager()) return;
  stReturn = '';
  if(d !== todayStr()){
    showSheet(`<h3>🔒 قفل يوم سابق (${esc(d)})</h3><p class="sub">لا يمكن جرد الدرج بأثر رجعي، فيُقفل هذا اليوم مباشرة.</p>
      <button class="btn magic full" onclick="setDayLock('${esc(d)}',true)">قفل اليوم</button><button class="btn ghost full" onclick="closeSheet()">إلغاء</button>`);
    return;
  }
  const rows = db.cashboxes.map(b => ({ b, s: dayBoxStatus(b, d) }));
  const allOk = rows.every(r => r.s.ok);
  const pn = pendingItems().length;
  const rowHtml = rows.map(r => `<div class="card top" style="margin:6px 0"><div><b>${esc(r.b.name)}</b><div class="sub">${esc(r.s.txt)} · الدفتري ${fmt(boxBal(r.b))} ${esc(symOf(r.b.cur))}</div></div>
    ${r.s.st && r.s.st.status === 'open' && stocktakeValid(r.s.st, r.b) ? `<button class="chip" onclick="stReturn='${esc(d)}';showStocktakeResult('${r.s.st.id}')">مراجعة</button>` : (r.s.optional ? `<button class="chip" onclick="openStocktake('${r.b.id}','${esc(d)}')">جرد (اختياري)</button>` : `<button class="chip" onclick="openStocktake('${r.b.id}','${esc(d)}')">${r.s.ok ? 'إعادة جرد' : 'جرد'}</button>`)}</div>`).join('');
  showSheet(`<h3>🔒 إغلاق يومية ${esc(d)}</h3>
    <div class="sub">لازم تجرد كل صندوق تحرّك اليوم، وأي فرق لازم يُسوّى بقيد أو يُقبل مع ذكر السبب.</div>
    ${pn ? `<div class="warn-box" style="margin-top:8px" onclick="showPending()">🔔 يوجد ${pn} عملية تحتاج مراجعة (تقدر تقفل بدون حلّها).</div>` : ''}
    <div style="max-height:46vh;overflow:auto;margin-top:6px">${rowHtml}</div>
    <button class="btn magic full" ${allOk ? '' : 'disabled style="opacity:.5"'} onclick="setDayLock('${esc(d)}',true)">🔒 قفل اليومية</button>
    ${allOk ? '' : '<div class="sub" style="color:var(--warn)">القفل معطّل حتى تُطابق كل الصناديق.</div>'}
    <button class="btn ghost full" onclick="closeSheet()">إلغاء</button>`);
}

function fmtStamp(ms){
  const d = new Date(Number(ms) || 0);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function showAuditLog(){
  const names = {add:'إضافة', edit:'تعديل', del:'حذف', lock:'قفل يوم', unlock:'فتح قفل', import:'استيراد'};
  const a = (db.audit || []).slice().sort((x,y) => (Number(y._u)||0) - (Number(x._u)||0)).slice(0, 120);
  const rows = a.map(e => `<div class="card" style="padding:8px 10px;margin:6px 0"><b>${esc(names[e.act]||e.act)}</b> — ${esc(e.label||'')}<div class="sub">${esc(fmtStamp(e._u))} · ${esc(e.by||'')} (${esc(e.role||'')})</div></div>`).join('') || '<div class="sub">لا يوجد سجل بعد</div>';
  showSheet('<h3>📜 سجل التعديلات</h3><div style="max-height:60vh;overflow:auto">'+rows+'</div><button class="btn full" style="margin-top:8px" onclick="closeSheet()">إغلاق</button>');
}
function showSafetyBackups(){
  const arr = readBackups();
  const rows = arr.map((b,i) => {
    let cnt = '';
    try{ const d = JSON.parse(b.data); cnt = ' · ' + (d.tx||[]).length + ' عملية'; }catch(e){}
    return `<div class="card top" style="margin:6px 0"><div><b>${esc(fmtStamp(b.t))}</b><div class="sub">${esc(b.why||'')}${cnt}</div></div><button class="chip" onclick="confirmRestoreBackup(${i})">استعادة</button></div>`;
  }).reverse().join('') || '<div class="sub">لا توجد نسخ أمان بعد.</div>';
  showSheet('<h3>🛟 نسخ الأمان المحلية</h3><div style="max-height:60vh;overflow:auto">'+rows+'</div><button class="btn full" style="margin-top:8px" onclick="closeSheet()">إغلاق</button>');
}
function confirmRestoreBackup(i){
  const b = readBackups()[i]; if(!b) return;
  showSheet(`<h3>استعادة نسخة ${esc(fmtStamp(b.t))}؟</h3><p>سيتم استبدال كل البيانات الحالية (وعلى السحاب) بهذه النسخة.</p><div style="display:flex;gap:8px"><button class="btn danger full" onclick="doRestoreBackup(${i})">نعم، استعد</button><button class="btn ghost full" onclick="closeSheet()">إلغاء</button></div>`);
}
function doRestoreBackup(i){
  const b = readBackups()[i]; if(!b) return;
  try{
    const d = JSON.parse(b.data);
    if(!d || !Array.isArray(d.tx) || !Array.isArray(d.currencies) || !Array.isArray(d.cashboxes) || !Array.isArray(d.customers)) throw 0;
    takeSafetyBackup('before-restore', true);
    d.rates = (d.rates && typeof d.rates === 'object') ? d.rates : {};
    db = d; ensureDefaults(); save(true); render(); closeSheet(); setState('تمت الاستعادة ✓');
  }catch(e){
    showSheet('<h3>تعذّرت الاستعادة</h3><p>النسخة تالفة.</p><button class="btn full" onclick="closeSheet()">حسناً</button>');
  }
}

function exportData(){ const t=$('#bk'); t.value=JSON.stringify(db); t.focus(); t.select(); }
function importData(){
  const e=$('#bkErr');
  try{
    const d=JSON.parse($('#bk').value);
    if(!d||!Array.isArray(d.tx)||!Array.isArray(d.currencies)||!Array.isArray(d.cashboxes)||!Array.isArray(d.customers)) throw 0;
    d.rates=(d.rates&&typeof d.rates==='object')?d.rates:{};
    takeSafetyBackup('before-import', true); db=d; ensureDefaults(); save(true); render(); setState('تم الاستيراد ✓');
  }catch(x){e.textContent='النص غير صالح';e.style.display='block';}
}
function importJsonFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(!d||!Array.isArray(d.tx)||!Array.isArray(d.currencies)||!Array.isArray(d.cashboxes)||!Array.isArray(d.customers)) throw 0;
      d.rates=(d.rates&&typeof d.rates==='object')?d.rates:{};
      takeSafetyBackup('before-import', true); db=d; ensureDefaults(); save(true); render(); setState('تم استيراد الملف ✓');
      showSheet('<h3>تم الاستيراد بنجاح ✓</h3><p>تم استعادة كافة البيانات والصناديق ورأس المال من الملف بنجاح.</p><button class="btn full" onclick="closeSheet()">حسناً</button>');
    }catch(err){
      const el=$('#bkErr'); if(el){el.textContent='ملف غير صالح';el.style.display='block';}
    }
  };
  reader.readAsText(file);
}

/* ---------- النافذة وتثبيت التطبيق PWA ---------- */
function showSheet(h){ $('#sheet').innerHTML=h; $('#ov').classList.add('open'); applyPrivacyState(); }
function closeSheet(){ $('#ov').classList.remove('open'); }

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = $('#pwaInstallBtn');
  if(btn) btn.style.display = 'inline-block';
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const btn = $('#pwaInstallBtn');
  if(btn) btn.style.display = 'none';
  setState('تم تثبيت التطبيق ✓');
});

async function installPWA(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    if(outcome === 'accepted'){
      const btn = $('#pwaInstallBtn');
      if(btn) btn.style.display = 'none';
    }
    deferredInstallPrompt = null;
  } else {
    showSheet('<h3>📲 تثبيت التطبيق</h3><p>لتثبيت التطبيق على شاشتك الرئيسية: افتح قائمة المتصفح (الثلاث نقاط ⋮) واختر <b>«تثبيت التطبيق» (Install app)</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</p><button class="btn full" onclick="closeSheet()">حسناً</button>');
  }
}

(async function init(){
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{ if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js'); }catch(e){}
  initSupabase();
  if(sbClient){
    try{
      const { data: { session } } = await sbClient.auth.getSession();
      if(session && session.user){
        currentUser = session.user;
        onLoginSuccess();
        return;
      }
    }catch(e){}
  }
  $('#authContainer').style.display = 'block';
})();
</script>
